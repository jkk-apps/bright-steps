<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no: stops little fingers pinch-zooming the game (respected when launched from the home-screen icon) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bright Steps — Learn Your Way</title>
  <meta name="description" content="Adaptive early-years learning for ages 4-7 (UK EYFS/KS1)." />

  <!-- PWA: installable app + iPhone home-screen support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#5f27cd" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bright Steps" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- modern rounded typeface (graceful fallback to system rounded fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/* ---- Bright Steps — child-friendly UI ---- */
:root {
  /* app theme — swapped per child to match their avatar (see AVATAR_THEMES) */
  --theme: #5f27cd;
  --theme-dark: #431b96;
  --theme-soft: #f0e8ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Fredoka", ui-rounded, "SF Pro Rounded", "Comic Sans MS", "Chalkboard SE", "Segoe UI Rounded", "Trebuchet MS", sans-serif;
  background: linear-gradient(160deg, #fff8ec 0%, #fdeef6 48%, #ecf4ff 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #3d3a4b;
  /* little fingers tap, drag and double-tap: never select text or show tap flash */
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
/* ...except form fields, where adults may want to edit text */
input, textarea, select {
  user-select: text;
  -webkit-user-select: text;
}
/* soft ambient colour blobs behind everything (one tints to the child's theme) */
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%; filter: blur(80px);
  opacity: .5; pointer-events: none; z-index: 0;
}
body::before { width: 360px; height: 360px; background: var(--theme-soft); top: -90px; right: -70px; }
body::after { width: 320px; height: 320px; background: #ffe1c9; bottom: -80px; left: -70px; }
.app { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; position: relative; z-index: 1; }

h1.app-title {
  text-align: center; font-size: 2.5rem; font-weight: 700; letter-spacing: .5px; margin: 10px 0 2px;
  background: linear-gradient(120deg, var(--theme), var(--theme-dark));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.tagline { text-align: center; color: #8a8699; margin: 0 0 18px; font-weight: 500; letter-spacing: .4px; }
.greeting { text-align: center; font-size: 1.3rem; margin: 6px 0 14px; color: #444; }
.greeting b { color: var(--theme); }

/* buttons */
.btn {
  font-family: inherit; border: none; cursor: pointer; border-radius: 16px;
  padding: 12px 22px; font-size: 1.1rem; font-weight: 600;
  /* glossy top light over the theme colour = polished candy button */
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 42%), var(--theme);
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.18);
  box-shadow: 0 4px 0 var(--theme-dark), 0 8px 14px rgba(0,0,0,.08); transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--theme-dark), 0 3px 6px rgba(0,0,0,.08); }
.btn.secondary { background: rgba(255,255,255,.92); color: var(--theme); text-shadow: none; box-shadow: 0 4px 0 var(--theme-soft), 0 8px 14px rgba(0,0,0,.06); }
.btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.smart-btn { display: block; margin: 0 auto 20px; font-size: 1.3rem; padding: 16px 34px; border-radius: 20px; }

/* home */
.skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.skill-card {
  background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 45%), var(--c, var(--theme));
  color: #fff; border-radius: 20px; padding: 18px 12px 14px;
  cursor: pointer; text-align: center;
  /* chunky 3D button: dark base layer + soft drop shadow */
  box-shadow: 0 6px 0 rgba(0,0,0,.17), 0 14px 24px rgba(0,0,0,.10);
  transition: transform .08s, box-shadow .08s, filter .12s;
  animation: rise .35s ease backwards; /* staggered entrance via nth-child delays below */
}
.skill-card:nth-child(2) { animation-delay: .04s; }
.skill-card:nth-child(3) { animation-delay: .08s; }
.skill-card:nth-child(4) { animation-delay: .12s; }
.skill-card:nth-child(5) { animation-delay: .16s; }
.skill-card:nth-child(6) { animation-delay: .20s; }
.skill-card:nth-child(7) { animation-delay: .24s; }
.skill-card:nth-child(8) { animation-delay: .28s; }
.skill-card:nth-child(9) { animation-delay: .32s; }
.skill-card:hover { filter: brightness(1.06); }
.skill-card:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 rgba(0,0,0,.17), 0 5px 10px rgba(0,0,0,.10);
}
.skill-icon {
  font-size: 2rem; line-height: 1; width: 58px; height: 58px; margin: 0 auto;
  background: rgba(255,255,255,.24); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 5px rgba(255,255,255,.35);
}
.skill-name { font-size: 1.15rem; font-weight: bold; margin: 6px 0 2px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.skill-level { color: rgba(255,255,255,.92); font-size: .8rem; }
.parent-link { text-align: center; margin-top: 26px; }
/* deliberately plain + grey so children aren't drawn to it */
.parent-gate-link { background: none; border: none; cursor: pointer; font-family: inherit; color: #9a9aa5; font-size: .95rem; text-decoration: underline; padding: 10px; }

/* parent gate: press-and-hold keeps little fingers out of the settings */
.gate-card { text-align: center; padding: 34px 20px; }
.gate-lock { font-size: 3rem; }
.gate-title { font-size: 1.4rem; font-weight: bold; margin: 8px 0 4px; }
.gate-sub { color: #777; max-width: 400px; margin: 0 auto 20px; line-height: 1.5; }
.gate-hold {
  position: relative; overflow: hidden; font-family: inherit; font-size: 1.15rem; font-weight: bold;
  border: none; border-radius: 18px; padding: 18px 36px; background: #fff; color: var(--theme);
  box-shadow: 0 5px 0 var(--theme-soft); cursor: pointer;
  -webkit-touch-callout: none; touch-action: none;
}
.gate-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--theme); opacity: .22; }
.gate-hold.holding .gate-fill { width: 100%; transition: width 3s linear; }
.gate-label { position: relative; }

/* session chrome */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.home-btn { font-size: 1.6rem; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: none; border-radius: 14px; padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.08), 0 6px 12px rgba(0,0,0,.06); }
.session-title { font-size: 1.3rem; font-weight: 600; }
.round-pill { background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 16px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,0,0,.07); }
.method-tag-wrap { text-align: center; }
.method-tag { display: inline-block; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 999px; color: #777482; margin: 4px auto 14px; font-size: .95rem; font-weight: 500; }

/* prompt area */
.prompt { text-align: center; margin: 10px 0 22px; }
.prompt-text { font-size: 1.5rem; margin-top: 10px; color: #444; }
.big-letter { font-size: 5rem; font-weight: bold; color: var(--theme); }
.word { font-size: 3.4rem; font-weight: bold; letter-spacing: 4px; color: #2e86de; }
.emoji-row { font-size: 2.6rem; line-height: 1.4; max-width: 640px; margin: 0 auto; }
.sentence-card { background: #fff; border-radius: 20px; padding: 18px 22px; font-size: 2rem; display: inline-block; box-shadow: 0 8px 20px rgba(93,63,152,.10); border: 1px solid rgba(255,255,255,.8); }
.speaker { font-size: 1.6rem; background: #ffe9a8; border: none; border-radius: 50%; width: 56px; height: 56px; cursor: pointer; margin-left: 10px; vertical-align: middle; box-shadow: 0 3px 0 #e0c36a; }
.speaker:active { transform: scale(.92); }
.speaker.big { width: 88px; height: 88px; font-size: 2.6rem; display: block; margin: 0 auto; }

/* choice */
.options { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.option {
  font-family: inherit; font-size: 2rem; font-weight: 600; min-width: 110px; min-height: 96px; padding: 14px 22px;
  border-radius: 20px; border: 4px solid #f0edf6; background: #fff; cursor: pointer;
  box-shadow: 0 5px 0 #e7e3ef, 0 10px 16px rgba(0,0,0,.05); transition: transform .08s;
}
.option:hover { transform: scale(1.05); }
.option.correct { background: #c8f7c5; border-color: #2ecc71; animation: pop .4s; }
.option.wrong { background: #ffd6d6; border-color: #ee5253; animation: shake .4s; }
.option.word-option { font-size: 1.7rem; letter-spacing: 2px; }
/* colour swatches — base rule so they show in every game mode (choice, match, hunt) */
.swatch { display: block; width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(0,0,0,.15); }
.option .swatch { width: 64px; height: 64px; margin: 0 auto; }
.swatch-option { min-width: 96px; }

/* match */
.match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 520px; margin: 0 auto; }
.match-card {
  min-height: 110px; border-radius: 18px; border: 4px solid #f0edf6; background: #fff; cursor: pointer;
  font-size: 2.2rem; display: flex; align-items: center; justify-content: center; padding: 8px;
  box-shadow: 0 4px 0 #e7e3ef, 0 8px 14px rgba(0,0,0,.05); font-family: inherit;
}
.match-card.selected { border-color: var(--theme); background: var(--theme-soft); }
.match-card.matched { border-color: #2ecc71; background: #c8f7c5; animation: pop .4s; }
.match-card.wrong { border-color: #ee5253; animation: shake .4s; }
.match-card .mini { font-size: 1.2rem; }
.sentence-mini { font-size: 1.05rem !important; line-height: 1.3; }

/* hunt */
.hunt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 520px; margin: 0 auto; }
.hunt-tile {
  min-height: 100px; font-size: 2.4rem; border-radius: 18px; border: 4px solid #f0edf6; background: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #e7e3ef, 0 8px 14px rgba(0,0,0,.05); font-family: inherit;
}
.hunt-tile.found { background: #c8f7c5; border-color: #2ecc71; animation: pop .35s; }
.hunt-tile.missed { background: #eee; color: #bbb; animation: shake .35s; }
.circle, .hunt-tile .swatch { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(0,0,0,.12); display: block; }

/* build */
.build-slots { display: flex; gap: 8px; justify-content: center; margin: 18px 0; flex-wrap: wrap; }
.slot {
  min-width: 56px; height: 64px; padding: 0 10px; border-radius: 12px; border: 3px dashed #bbb; background: #fff;
  font-size: 1.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit;
}
.slot.filled { border-style: solid; border-color: var(--theme); background: var(--theme-soft); }
.slot.correct { background: #c8f7c5; border-color: #2ecc71; }
.slot.wrong { border-color: #ee5253; animation: shake .4s; }
.tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-width: 60px; height: 68px; font-size: 1.8rem; border-radius: 14px; border: none; background: #ffd166;
  cursor: pointer; box-shadow: 0 4px 0 #e0a92f; font-family: inherit; padding: 0 14px;
}
.tile:disabled { opacity: .25; box-shadow: none; }

/* feedback */
.feedback-overlay {
  position: fixed; inset: 0; background: rgba(255,255,255,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 50; animation: fadein .15s;
}
.feedback-emoji { font-size: 6rem; animation: pop .5s; }
.feedback-word { font-size: 2rem; font-weight: bold; color: var(--theme); margin-top: 8px; }
.level-up { font-size: 1.4rem; color: #e58e09; font-weight: bold; margin-top: 6px; }

/* summary + dashboard */
.summary-card, .dash-card { background: rgba(255,255,255,.92); border-radius: 26px; padding: 26px; box-shadow: 0 10px 28px rgba(93,63,152,.09); border: 1px solid rgba(255,255,255,.8); max-width: 640px; margin: 0 auto 18px; }
.summary-stars { font-size: 3rem; text-align: center; letter-spacing: 6px; }
.summary-msg { text-align: center; font-size: 1.4rem; margin: 10px 0; }
.method-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.chip { background: #f4f4f8; border-radius: 999px; padding: 8px 16px; font-size: 1rem; }
.dash-card { text-align: left; }
.dash-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.dash-head .icon { font-size: 2rem; }
.dash-head .name { font-size: 1.3rem; font-weight: bold; }
.level-pill { margin-left: auto; background: var(--theme-soft); color: var(--theme); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: bold; }
.bar-row { display: grid; grid-template-columns: 160px 1fr 110px; align-items: center; gap: 10px; margin: 6px 0; }
.bar { background: #eee; border-radius: 999px; height: 16px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #10ac84, #1dd1a1); }
.bar-label { font-size: .9rem; color: #666; }
.best-badge { color: #e58e09; }
.dash-note { color: #777; font-size: .95rem; line-height: 1.5; }
input.name-input, select { font-family: inherit; font-size: 1.05rem; padding: 10px 14px; border-radius: 12px; border: 2px solid #ddd; }
.settings-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.confetti { position: fixed; top: -40px; font-size: 1.8rem; animation: fall linear forwards; z-index: 60; pointer-events: none; }

/* piano keyboard */
.piano { display: flex; max-width: 640px; margin: 8px auto 0; height: 180px; border-radius: 0 0 14px 14px; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
.piano-key { flex: 1; background: #fff; border: 1px solid #bbb; border-top: none; border-radius: 0 0 10px 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font-size: 1.4rem; font-weight: bold; color: #555; cursor: pointer; user-select: none; -webkit-user-select: none; }
.piano-key:active { filter: brightness(.92); }
.piano-key.hit { background: #c8f7c5 !important; }
.piano-key.bad { background: #ffd6d6 !important; animation: shake .4s; }
.piano-key.target-flash { animation: pulse .5s 3; background: #ffe9a8 !important; }
.piano-replay { text-align: center; min-height: 10px; margin-bottom: 12px; }
/* free-play piano: taller, relaxed keys for little hands */
.piano.free { height: 300px; margin-top: 18px; max-width: 620px; }
.piano.free .piano-key { font-size: 2rem; padding-bottom: 20px; }
.free-piano-row { text-align: center; margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* sticker album */
.sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px; margin-top: 14px; }
.sticker-cell { position: relative; background: #fff; border-radius: 16px; font-size: 2.4rem; padding: 12px 0; text-align: center; box-shadow: 0 3px 8px rgba(0,0,0,.08); animation: pop .3s; }
.sticker-cell.rare { background: linear-gradient(160deg, #fff8d6, #ffe89a); box-shadow: 0 0 14px rgba(255, 200, 40, .55); }
.sticker-cell.empty { opacity: .18; filter: grayscale(1); box-shadow: none; animation: none; }
.sticker-count { position: absolute; top: 4px; right: 8px; font-size: .8rem; font-weight: bold; color: #888; }
.sticker-reveal { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 10px auto 4px; background: linear-gradient(160deg, #fff8d6, #ffe89a); border: 3px solid #f0c93e; border-radius: 20px; padding: 12px 26px; cursor: pointer; font-family: inherit; animation: pop .5s; }
.sticker-reveal-text { font-size: 1.05rem; font-weight: bold; color: #7a5a00; }
.sticker-big { font-size: 3.4rem; line-height: 1.2; }
.sticker-reveal-sub { font-size: .8rem; color: #a08030; }

/* milestone certificate */
.certificate { max-width: 540px; margin: 18px auto; background: #fffdf4; border: 6px double #d4af37; border-radius: 20px; padding: 30px 24px; text-align: center; box-shadow: 0 14px 34px rgba(0,0,0,.14); animation: rise .5s ease; }
.cert-stars { font-size: 1.6rem; letter-spacing: 8px; }
.cert-heading { font-size: 1.5rem; font-weight: bold; color: #8a6d1d; letter-spacing: 2px; margin: 6px 0 10px; text-transform: uppercase; }
.cert-avatar { font-size: 3.4rem; }
.cert-name { font-size: 2.2rem; font-weight: bold; color: var(--theme); margin: 4px 0; }
.cert-text { color: #666; font-size: 1.1rem; margin: 4px 0; }
.cert-award { font-size: 1.5rem; font-weight: bold; color: #333; margin: 6px 0; }
.cert-date { color: #999; font-size: .95rem; margin-top: 10px; font-style: italic; }
.cert-row { padding: 7px 0; border-bottom: 1px solid #f0f0f6; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cert-row .profile-sub { margin-left: auto; }

/* coins (money module) */
.coin { display: inline-flex; align-items: center; justify-content: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--coin-col, #b8c0cc); box-shadow: inset 0 0 0 .09em rgba(255,255,255,.5), 0 3px 6px rgba(0,0,0,.18); vertical-align: middle; }
.coin span { font-size: .36em; font-weight: 700; color: rgba(40,30,10,.72); }

/* tracing (finger letter formation) */
.trace-wrap { position: relative; width: min(calc(100vw - 60px), 340px); margin: 6px auto; aspect-ratio: 1; background: #fff; border: 3px dashed #d8d8e4; border-radius: 18px; overflow: hidden; }
.trace-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-draw { touch-action: none; cursor: crosshair; }

/* sound-it-out helper button (words game) */
.sound-out { display: inline-block; margin-top: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; color: var(--theme); background: var(--theme-soft); border: none; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
/* always-on reminder for grown-ups: phone must be set to ring for sound */
.sound-note { text-align: center; color: #8a8699; font-size: .9rem; margin: 14px auto 0; max-width: 420px; }
/* shown only when a key tap produced no audio (device muted/interrupted) */
.sound-hint { display: none; text-align: center; color: #c47b12; font-size: .95rem; font-weight: 500; margin: 12px auto 0; max-width: 420px; }
.sound-hint.show { display: block; }
.mini-spk { width: 40px; height: 40px; font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; vertical-align: middle; }
.opt-word { vertical-align: middle; }

/* tappable prompts replay their spoken instruction */
.speakable { cursor: pointer; border-radius: 14px; transition: background .15s; }
.speakable:active { background: var(--theme-soft); }

/* circled groups of ten for place-value counting (numbers game) */
.ten-group {
  display: inline-block; border: 3px dashed #ffb347; border-radius: 14px;
  padding: 3px 6px; margin: 3px; background: #fff8ec;
}
.ones-group { display: inline-block; margin: 3px; }
/* 10×10 "hundred flat" place-value block (numbers level 6) */
.hundred-flat {
  display: inline-block; width: 52px; height: 52px; margin: 3px; vertical-align: middle;
  border-radius: 8px; border: 2px solid #e0a92f;
  background:
    repeating-linear-gradient(0deg, transparent 0 4.2px, rgba(224,169,47,.55) 4.2px 5.2px),
    repeating-linear-gradient(90deg, transparent 0 4.2px, rgba(224,169,47,.55) 4.2px 5.2px),
    #fff3d6;
}

/* fractions: flat sliced circles (SVG, drawn in activities.js) + stacked notation with vinculum */
.frac-pie { display: inline-block; vertical-align: middle; }
.option .frac-pie, .match-card .frac-pie { display: block; margin: 0 auto; }
.frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; line-height: 1.05; font-weight: 700; }
.frac span:first-child { border-bottom: 3px solid currentColor; padding: 0 6px; }
.frac-option { display: inline-flex; align-items: center; justify-content: center; }

/* pre-reader friendly end-of-game buttons: icon-first, colour-coded */
.again-big, .home-big { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 34px; border-radius: 26px; }
.again-big { background: #ff9f43; box-shadow: 0 6px 0 #cc7a1e; animation: pulse 1.6s ease-in-out infinite; }
.again-big:active { transform: translateY(3px); box-shadow: 0 2px 0 #cc7a1e; }
.home-big { background: #fff; color: var(--theme); box-shadow: 0 6px 0 var(--theme-soft); }
.big-emoji { font-size: 3rem; line-height: 1; }
.btn-label { font-size: 1rem; }
.confetti.star { filter: drop-shadow(0 0 8px rgba(255, 193, 7, .9)); }

/* profiles */

  /* accuracy is parent info (it lives on the dashboard) — hide on phones to save a row per tile */

<body>
  <div id="app" class="app"></div>
  <script>
// ===== js/speech.js =====
// Web Speech API wrapper — prefers a soft female voice; parents can override
// the choice from the dashboard (stored per device in settings).

let voice = null;
let preferredVoiceName = null;

// Ranked soft/female voices across platforms:
//   iOS/macOS: Serena, Kate, Stephanie, Martha, Shelley…
//   Chrome:    "Google UK English Female"
//   Windows:   Hazel (en-GB), Zira/Susan (en-US)
const FEMALE_PREFERENCES = [
  'serena', 'kate', 'stephanie', 'google uk english female', 'hazel',
  'shelley', 'sandy', 'flo', 'samantha', 'zira', 'susan', 'victoria',
  'moira', 'tessa', 'allison', 'ava', 'zoe', 'martha',
];

const isGB = v => /en[-_]GB/i.test(v.lang);

// Downloaded "(Enhanced)"/"(Premium)" Apple voices sound far more human than the
// built-in compact ones — always prefer them when present on this device.
const isHighQuality = v => /\(enhanced\)|\(premium\)/i.test(v.name || '');

function findByHints(voices) {
  for (const hint of FEMALE_PREFERENCES) {
    const v = voices.find(x => x.name.toLowerCase().includes(hint));
    if (v) return v;
  }
  return null;
}

function speechAvailable() {
  return typeof window !== 'undefined' && 'speechSynthesis' in window;
}

function getVoices() {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices();
}

function pickVoice() {
  const vs = getVoices();
  if (!vs.length) return;
  // 1) parent's saved choice
  if (preferredVoiceName) {
    const chosen = vs.find(v => v.name === preferredVoiceName);
    if (chosen) { voice = chosen; return; }
  }
  // 2) soft female in the best available quality (enhanced/premium first),
  //    British first, then any soft female, then any British, then any English
  const gb = vs.filter(isGB);
  voice = findByHints(gb.filter(isHighQuality))
       || findByHints(vs.filter(isHighQuality))
       || findByHints(gb)
       || gb.find(v => /female|grandma|shelley|sandy|flo/i.test(v.name))
       || findByHints(vs)
       || vs.find(v => /female/i.test(v.name))
       || gb[0]
       || vs.find(v => /^en/i.test(v.lang))
       || vs[0];
}

function setVoicePreference(name) {
  preferredVoiceName = name || null;
  pickVoice();
}

// Browsers load voices asynchronously — let screens re-populate when they arrive
const voiceListeners = new Set();
function onVoicesChanged(fn) {
  voiceListeners.add(fn);
  return () => voiceListeners.delete(fn);
}

function handleVoicesChanged() {
  pickVoice();
  voiceListeners.forEach(fn => { try { fn(); } catch { /* listener gone */ } });
}

function currentVoiceName() { return voice ? voice.name : null; }

if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = handleVoicesChanged;
  if (window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', handleVoicesChanged);
  }
  // nudge browsers that defer loading the voice list (Chrome especially)
  getVoices();
  setTimeout(getVoices, 300);
}

// Emojis are for the screen only — strip them so the voice never reads out
// things like "glowing star" or "flexed biceps".
function stripEmoji(text) {
  return String(text)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Pick the nicest voice for another language (Spanish/French lessons),
// preferring a soft female voice when one exists on this device.
function voiceForLang(lang) {
  const prefix = String(lang).split('-')[0].toLowerCase();
  const vs = getVoices().filter(v => (v.lang || '').toLowerCase().startsWith(prefix));
  return findByHints(vs.filter(isHighQuality)) || findByHints(vs) || vs.find(v => /female/i.test(v.name)) || vs[0] || null;
}

function speak(text, opts = {}) {
  text = stripEmoji(text);
  if (!text || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
  if (!opts.onend) window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (opts.lang) {
    const lv = voiceForLang(opts.lang);
    if (lv) { u.voice = lv; u.lang = lv.lang; } else { u.lang = opts.lang; }
  } else if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-GB'; }
  u.rate = opts.rate ?? 0.85;    // gentle pace for little ears
  u.pitch = opts.pitch ?? 1.05;  // soft, warm tone
  if (opts.onend) u.onend = opts.onend;
  window.speechSynthesis.speak(u);
}

// Speak a sequence of parts, e.g. English instruction then a Spanish word:
//   speakSeq([{ text: 'Listen!' }, { text: 'gato', lang: 'es-ES' }])
function speakSeq(parts) {
  if (!speechAvailable() || !parts || !parts.length) return;
  window.speechSynthesis.cancel();
  const run = i => {
    if (i >= parts.length) return;
    speak(parts[i].text, { lang: parts[i].lang, onend: () => run(i + 1) });
  };
  run(0);
}

function stopSpeak() {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}

// ===== js/audio.js =====
// Web Audio: gentle piano-like tones for the piano module.
// Two oscillators (fundamental + soft octave harmonic) with a plucked envelope.

let ctx = null;

function audioCtx() {
  if (typeof window === 'undefined') return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    ctx = ctx || new AC();
    return ctx;
  } catch { return null; }
}

// Ask iOS to treat our audio like music playback, so it still sounds when the
// phone's silent/mute switch is on (supported iOS 17+, ignored elsewhere).
if (typeof navigator !== 'undefined' && 'audioSession' in navigator) {
  try { navigator.audioSession.type = 'playback'; } catch { /* unsupported */ }
}

// iOS can leave the context 'interrupted' or 'suspended' — especially after
// text-to-speech has run — so always resume first, and only schedule the note
// once the context is actually running.
function whenRunning(fn) {
  const c = audioCtx();
  if (!c) return;
  if (c.state === 'running') { fn(c); return; }
  c.resume().then(() => { if (c.state === 'running') fn(c); }).catch(() => {});
}

// Warm up the audio context on any user touch so autoplay policies are
// satisfied before the first note needs to play.
function unlockAudio() { whenRunning(() => {}); }

// Is audio actually able to produce sound right now? (Used for the free-play
// "no sound" hint when the device is muted/interrupted.)
function audioReady() { return !!ctx && ctx.state === 'running'; }

function scheduleNote(c, freq, dur) {
  try {
    const t = c.currentTime;
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const o1 = c.createOscillator();
    o1.type = 'triangle';
    o1.frequency.value = freq;

    const o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2;
    const g2 = c.createGain();
    g2.gain.value = 0.22;

    o1.connect(gain);
    o2.connect(g2);
    g2.connect(gain);
    gain.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  } catch { /* audio unavailable — ignore */ }
}

function playNote(freq, dur = 0.8) {
  whenRunning(c => scheduleNote(c, freq, dur));
}

// Play a little tune: array of frequencies spaced by `gap` ms
function playNotes(freqs, gap = 600) {
  freqs.forEach((f, i) => setTimeout(() => playNote(f), i * gap));
}

// ===== js/engine.js =====
// Adaptive engine: multiple child profiles, each with its own stats and
// progress. Tracks success per skill per learning method, chooses methods
// weighted by success (with exploration), and moves levels up/down.

const METHODS = ['look', 'hear', 'match', 'play'];
const METHOD_META = {
  look:  { name: 'Look & Find',   icon: '👀', blurb: 'Seeing and choosing' },
  hear:  { name: 'Listen & Find', icon: '👂', blurb: 'Hearing and choosing' },
  match: { name: 'Match It',      icon: '🧩', blurb: 'Matching pairs' },
  play:  { name: 'Tap & Play',    icon: '🎈', blurb: 'Hands-on tapping games' },
};

const AVATARS = ['🦊', '🐰', '🦁', '🐸', '🐼', '🦄', '🐯', '🐧', '🦉', '🐳'];

// Each avatar re-themes the whole app: main colour, dark "3D base" shade, soft tint.
const DEFAULT_THEME = { c: '#5f27cd', dark: '#431b96', soft: '#f0e8ff' };
const AVATAR_THEMES = {
  '🦊': { c: '#ff8c42', dark: '#d96a1e', soft: '#ffe8d6' }, // fox — orange
  '🐰': { c: '#ff6b9d', dark: '#d94f80', soft: '#ffe0eb' }, // bunny — pink
  '🦁': { c: '#f59f00', dark: '#c77e00', soft: '#ffedcc' }, // lion — golden
  '🐸': { c: '#10ac84', dark: '#0b8566', soft: '#d4f3e9' }, // frog — green
  '🐼': { c: '#576574', dark: '#3d4a5c', soft: '#e2e8f0' }, // panda — slate
  '🦄': { c: '#845ef2', dark: '#6741d9', soft: '#e9e2fd' }, // unicorn — purple
  '🐯': { c: '#f76707', dark: '#c94f00', soft: '#ffe3d1' }, // tiger — deep orange
  '🐧': { c: '#2e86de', dark: '#1d68b3', soft: '#d9eafb' }, // penguin — blue
  '🦉': { c: '#a1723f', dark: '#7d5730', soft: '#f1e4d4' }, // owl — brown
  '🐳': { c: '#00b8d4', dark: '#0090a8', soft: '#d3f3fa' }, // whale — cyan
};
function themeFor(avatar) { return AVATAR_THEMES[avatar] || DEFAULT_THEME; }

const KEY = 'brightsteps.v2';
const OLD_KEY = 'brightsteps.v1'; // single-profile data from v1 is migrated

// localStorage with an in-memory fallback (also makes the engine testable in Node/JSC)
const mem = {};
const store = typeof localStorage !== 'undefined'
  ? localStorage
  : { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } };

function uid() { return 'p' + Math.random().toString(36).slice(2, 9); }

function fresh() {
  return { active: null, profiles: {}, settings: { override: null, voiceName: null } };
}

function migrateV1(old) {
  const id = uid();
  return {
    active: id,
    profiles: {
      [id]: {
        id,
        name: old.profile?.name || '',
        avatar: AVATARS[0],
        stats: old.stats || {},
        progress: old.progress || {},
        hiddenSkills: [],
        createdAt: Date.now(),
      },
    },
    settings: old.settings || { override: null },
  };
}

function load() {
  try {
    const s = JSON.parse(store.getItem(KEY));
    if (s && s.profiles) return s;
  } catch { /* fall through */ }
  try {
    const old = JSON.parse(store.getItem(OLD_KEY));
    if (old && old.profile) {
      const migrated = migrateV1(old);
      store.setItem(KEY, JSON.stringify(migrated));
      return migrated;
    }
  } catch { /* fall through */ }
  return fresh();
}

let state = load();
function save() { store.setItem(KEY, JSON.stringify(state)); }
function resetAll() { state = fresh(); save(); }

// Is this a plausible Bright Steps backup file?
function isValidBackup(data) {
  return !!(data && typeof data === 'object' && data.profiles && typeof data.profiles === 'object'
    && !Array.isArray(data.profiles));
}

// Replace ALL local data with an imported backup (moving to a new device).
function replaceState(data) {
  state = {
    active: data.active || null,
    profiles: data.profiles || {},
    settings: { override: null, voiceName: null, ...(data.settings || {}) },
  };
  if (!state.profiles[state.active]) state.active = Object.keys(state.profiles)[0] || null;
  save();
}

// ---------------- profiles ----------------
function listProfiles() { return Object.values(state.profiles); }
function activeProfile() { return state.profiles[state.active] || null; }

function addProfile(name, avatar, ageBand) {
  const id = uid();
  state.profiles[id] = {
    id,
    name: (name || '').trim(),
    avatar: avatar || AVATARS[0],
    ageBand: ageBand === '2-4' ? '2-4' : '4-7',
    stats: {},
    progress: {},
    hiddenSkills: [],   // parent-controlled per-child module visibility
    stickers: [],       // sticker album: emoji rewards earned per session
    certificates: [],   // { skill, level, at } — first time each level is reached
    createdAt: Date.now(),
  };
  state.active = id;
  save();
  return id;
}

function switchProfile(id) {
  if (state.profiles[id]) { state.active = id; save(); }
}

function updateProfile(id, patch) {
  const p = state.profiles[id];
  if (p) { Object.assign(p, patch); save(); }
}

function removeProfile(id) {
  if (!state.profiles[id]) return;
  delete state.profiles[id];
  if (state.active === id) state.active = listProfiles()[0]?.id || null;
  save();
}

// A child's age band ('4-7' for profiles created before bands existed).
function profileBand(profile) {
  const p = profile || activeProfile();
  return (p && p.ageBand) || '4-7';
}

// The highest level this child can reach in a skill (age-band capped).
function skillMax(profile, skillId) {
  return bandCap(profileBand(profile), skillId);
}

// Is a skill shown on this child's home screen? (default: yes)
// Skills capped to 0 by the child's age band are hidden automatically.
function isSkillVisible(profile, skillId) {
  const p = profile || activeProfile();
  if (!p) return true;
  if (bandCap(profileBand(p), skillId) === 0) return false;
  return !(p.hiddenSkills || []).includes(skillId);
}

// ---------------- rewards ----------------
// Award a sticker to the active child (rare pool for perfect sessions).
function awardSticker(rare = false) {
  const p = activeProfile();
  if (!p) return null;
  const pool = rare ? STICKERS.rare : STICKERS.common;
  const s = pool[Math.floor(Math.random() * pool.length)];
  (p.stickers ||= []).push(s);
  save();
  return s;
}

// Record a level certificate — only the FIRST time that level is reached.
// Returns the certificate, or null if it was already earned before.
function awardCertificate(skill, level) {
  const p = activeProfile();
  if (!p) return null;
  const list = (p.certificates ||= []);
  if (list.some(c => c.skill === skill && c.level === level)) return null;
  const cert = { skill, level, at: Date.now() };
  list.push(cert);
  save();
  return cert;
}

// Overall accuracy across all skills for one profile (or the active one)
function overallAccuracy(profile) {
  const p = profile || activeProfile();
  if (!p) return null;
  let answered = 0, correct = 0;
  for (const s of Object.values(p.progress)) {
    answered += s.answered || 0;
    correct += s.correct || 0;
  }
  return answered ? correct / answered : null;
}

// ---------------- adaptivity (always scoped to the active profile) ----------------
function getLevel(skill, maxLevel) {
  const p = activeProfile()?.progress[skill];
  return Math.min(p?.level || 1, maxLevel);
}

// Record one answer. 3 correct in a row => level up, 2 misses in a row => consolidate down.
function recordResult(skill, method, correct, maxLevel) {
  const prof = activeProfile();
  if (!prof) return null;

  const s = (prof.stats[skill] ||= {});
  const m = (s[method] ||= { attempts: 0, correct: 0 });
  m.attempts++;
  if (correct) m.correct++;

  const p = (prof.progress[skill] ||= { level: 1, streak: 0, wrong: 0, answered: 0, correct: 0 });
  p.answered++;
  let change = null;
  if (correct) {
    p.correct++; p.streak++; p.wrong = 0;
    if (p.streak >= 3 && p.level < maxLevel) { p.level++; p.streak = 0; change = 'up'; }
  } else {
    p.streak = 0; p.wrong++;
    if (p.wrong >= 2 && p.level > 1) { p.level--; p.wrong = 0; change = 'down'; }
  }
  save();
  return change;
}

function methodRate(skill, method) {
  const m = activeProfile()?.stats[skill]?.[method];
  if (!m || !m.attempts) return null;
  return m.correct / m.attempts;
}

// Weighted choice: (success rate)^2 + exploration floor. Unseen methods get a neutral 0.5
// so the app tries everything early, then converges on what works for this child.
// `allowed` optionally restricts the pool (e.g. language levels gate harder methods).
// A parent override outside the allowed pool is ignored.
function pickMethod(skill, allowed = METHODS) {
  const pool = METHODS.filter(m => allowed.includes(m));
  if (state.settings.override && pool.includes(state.settings.override)) return state.settings.override;
  const weights = pool.map(m => {
    const r = methodRate(skill, m);
    return r == null ? 0.5 : r * r + 0.12;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function bestMethod(skill) {
  let best = null, bestR = -1;
  for (const m of METHODS) {
    const r = methodRate(skill, m);
    if (r != null && r > bestR) { bestR = r; best = m; }
  }
  return best;
}

function skillAccuracy(skill) {
  const p = activeProfile()?.progress[skill];
  if (!p || !p.answered) return null;
  return p.correct / p.answered;
}

// How many sessions' worth of answers this skill has had (for Smart Session ordering)
function skillAnswered(skill) {
  return activeProfile()?.progress[skill]?.answered || 0;
}

// ===== js/data.js =====
// ---------------------------------------------------------------------------
// Content: skills, levels and learning material (aligned to UK EYFS / KS1).
// ---------------------------------------------------------------------------

const SKILLS = {
  numbers: {
    id: 'numbers', name: 'Numbers', icon: '🔢', colour: '#ff9f43', maxLevel: 6,

// Highest level this age band allows for a skill (0 = hidden for this band).
function bandCap(band, skillId) {
  const b = AGE_BANDS[band] || AGE_BANDS['4-7'];
  const full = SKILLS[skillId].maxLevel;
  if (!b.caps) return full;
  const c = b.caps[skillId];
  return c == null ? full : Math.min(c, full);
}
