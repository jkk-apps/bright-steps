<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Steps — Learn Your Way</title>
  <meta name="description" content="Adaptive early-years learning for ages 4-7 (UK EYFS/KS1)." />

  <!-- PWA: installable app + iPhone home-screen support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#5f27cd" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bright Steps" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- modern rounded typeface (graceful fallback to system rounded fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/* ---- Bright Steps — child-friendly UI ---- */
:root {
  /* app theme — swapped per child to match their avatar (see AVATAR_THEMES) */
  --theme: #5f27cd;
  --theme-dark: #431b96;
  --theme-soft: #f0e8ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Fredoka", ui-rounded, "SF Pro Rounded", "Comic Sans MS", "Chalkboard SE", "Segoe UI Rounded", "Trebuchet MS", sans-serif;
  background: linear-gradient(160deg, #fff8ec 0%, #fdeef6 48%, #ecf4ff 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #3d3a4b;
  /* little fingers tap, drag and double-tap: never select text or show tap flash */
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
/* ...except form fields, where adults may want to edit text */
input, textarea, select {
  user-select: text;
  -webkit-user-select: text;
}
/* soft ambient colour blobs behind everything (one tints to the child's theme) */
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%; filter: blur(80px);
  opacity: .5; pointer-events: none; z-index: 0;
}
body::before { width: 360px; height: 360px; background: var(--theme-soft); top: -90px; right: -70px; }
body::after { width: 320px; height: 320px; background: #ffe1c9; bottom: -80px; left: -70px; }
.app { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; position: relative; z-index: 1; }

h1.app-title {
  text-align: center; font-size: 2.5rem; font-weight: 700; letter-spacing: .5px; margin: 10px 0 2px;
  background: linear-gradient(120deg, var(--theme), var(--theme-dark));
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.tagline { text-align: center; color: #8a8699; margin: 0 0 18px; font-weight: 500; letter-spacing: .4px; }
.greeting { text-align: center; font-size: 1.3rem; margin: 6px 0 14px; color: #444; }
.greeting b { color: var(--theme); }

/* buttons */
.btn {
  font-family: inherit; border: none; cursor: pointer; border-radius: 16px;
  padding: 12px 22px; font-size: 1.1rem; font-weight: 600;
  /* glossy top light over the theme colour = polished candy button */
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 42%), var(--theme);
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.18);
  box-shadow: 0 4px 0 var(--theme-dark), 0 8px 14px rgba(0,0,0,.08); transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--theme-dark), 0 3px 6px rgba(0,0,0,.08); }
.btn.secondary { background: rgba(255,255,255,.92); color: var(--theme); text-shadow: none; box-shadow: 0 4px 0 var(--theme-soft), 0 8px 14px rgba(0,0,0,.06); }
.btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.smart-btn { display: block; margin: 0 auto 20px; font-size: 1.3rem; padding: 16px 34px; border-radius: 20px; }

/* home */
.skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.skill-card {
  background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 45%), var(--c, var(--theme));
  color: #fff; border-radius: 26px; padding: 26px 20px 20px;
  cursor: pointer; text-align: center;
  /* chunky 3D button: dark base layer + soft drop shadow */
  box-shadow: 0 6px 0 rgba(0,0,0,.17), 0 14px 24px rgba(0,0,0,.10);
  transition: transform .08s, box-shadow .08s, filter .12s;
  animation: rise .35s ease backwards; /* staggered entrance via nth-child delays below */
}
.skill-card:nth-child(2) { animation-delay: .04s; }
.skill-card:nth-child(3) { animation-delay: .08s; }
.skill-card:nth-child(4) { animation-delay: .12s; }
.skill-card:nth-child(5) { animation-delay: .16s; }
.skill-card:nth-child(6) { animation-delay: .20s; }
.skill-card:nth-child(7) { animation-delay: .24s; }
.skill-card:nth-child(8) { animation-delay: .28s; }
.skill-card:nth-child(9) { animation-delay: .32s; }
.skill-card:hover { filter: brightness(1.06); }
.skill-card:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 rgba(0,0,0,.17), 0 5px 10px rgba(0,0,0,.10);
}
.skill-icon {
  font-size: 2.7rem; line-height: 1; width: 76px; height: 76px; margin: 0 auto;
  background: rgba(255,255,255,.24); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 5px rgba(255,255,255,.35);
}
.skill-name { font-size: 1.5rem; font-weight: bold; margin: 8px 0 3px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.skill-level { color: rgba(255,255,255,.92); font-size: .95rem; }
.parent-link { text-align: center; margin-top: 26px; }
/* deliberately plain + grey so children aren't drawn to it */
.parent-gate-link { background: none; border: none; cursor: pointer; font-family: inherit; color: #9a9aa5; font-size: .95rem; text-decoration: underline; padding: 10px; }

/* parent gate: press-and-hold keeps little fingers out of the settings */
.gate-card { text-align: center; padding: 34px 20px; }
.gate-lock { font-size: 3rem; }
.gate-title { font-size: 1.4rem; font-weight: bold; margin: 8px 0 4px; }
.gate-sub { color: #777; max-width: 400px; margin: 0 auto 20px; line-height: 1.5; }
.gate-hold {
  position: relative; overflow: hidden; font-family: inherit; font-size: 1.15rem; font-weight: bold;
  border: none; border-radius: 18px; padding: 18px 36px; background: #fff; color: var(--theme);
  box-shadow: 0 5px 0 var(--theme-soft); cursor: pointer;
  -webkit-touch-callout: none; touch-action: none;
}
.gate-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--theme); opacity: .22; }
.gate-hold.holding .gate-fill { width: 100%; transition: width 3s linear; }
.gate-label { position: relative; }

/* session chrome */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.home-btn { font-size: 1.6rem; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: none; border-radius: 14px; padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.08), 0 6px 12px rgba(0,0,0,.06); }
.session-title { font-size: 1.3rem; font-weight: 600; }
.round-pill { background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 16px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,0,0,.07); }
.method-tag-wrap { text-align: center; }
.method-tag { display: inline-block; background: rgba(255,255,255,.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 999px; color: #777482; margin: 4px auto 14px; font-size: .95rem; font-weight: 500; }

/* prompt area */
.prompt { text-align: center; margin: 10px 0 22px; }
.prompt-text { font-size: 1.5rem; margin-top: 10px; color: #444; }
.big-letter { font-size: 5rem; font-weight: bold; color: var(--theme); }
.word { font-size: 3.4rem; font-weight: bold; letter-spacing: 4px; color: #2e86de; }
.emoji-row { font-size: 2.6rem; line-height: 1.4; max-width: 640px; margin: 0 auto; }
.sentence-card { background: #fff; border-radius: 20px; padding: 18px 22px; font-size: 2rem; display: inline-block; box-shadow: 0 8px 20px rgba(93,63,152,.10); border: 1px solid rgba(255,255,255,.8); }
.speaker { font-size: 1.6rem; background: #ffe9a8; border: none; border-radius: 50%; width: 56px; height: 56px; cursor: pointer; margin-left: 10px; vertical-align: middle; box-shadow: 0 3px 0 #e0c36a; }
.speaker:active { transform: scale(.92); }
.speaker.big { width: 88px; height: 88px; font-size: 2.6rem; display: block; margin: 0 auto; }

/* choice */
.options { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.option {
  font-family: inherit; font-size: 2rem; font-weight: 600; min-width: 110px; min-height: 96px; padding: 14px 22px;
  border-radius: 20px; border: 4px solid #f0edf6; background: #fff; cursor: pointer;
  box-shadow: 0 5px 0 #e7e3ef, 0 10px 16px rgba(0,0,0,.05); transition: transform .08s;
}
.option:hover { transform: scale(1.05); }
.option.correct { background: #c8f7c5; border-color: #2ecc71; animation: pop .4s; }
.option.wrong { background: #ffd6d6; border-color: #ee5253; animation: shake .4s; }
.option.word-option { font-size: 1.7rem; letter-spacing: 2px; }
/* colour swatches — base rule so they show in every game mode (choice, match, hunt) */
.swatch { display: block; width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(0,0,0,.15); }
.option .swatch { width: 64px; height: 64px; margin: 0 auto; }
.swatch-option { min-width: 96px; }

/* match */
.match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 520px; margin: 0 auto; }
.match-card {
  min-height: 110px; border-radius: 18px; border: 4px solid #f0edf6; background: #fff; cursor: pointer;
  font-size: 2.2rem; display: flex; align-items: center; justify-content: center; padding: 8px;
  box-shadow: 0 4px 0 #e7e3ef, 0 8px 14px rgba(0,0,0,.05); font-family: inherit;
}
.match-card.selected { border-color: var(--theme); background: var(--theme-soft); }
.match-card.matched { border-color: #2ecc71; background: #c8f7c5; animation: pop .4s; }
.match-card.wrong { border-color: #ee5253; animation: shake .4s; }
.match-card .mini { font-size: 1.2rem; }
.sentence-mini { font-size: 1.05rem !important; line-height: 1.3; }

/* hunt */
.hunt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 520px; margin: 0 auto; }
.hunt-tile {
  min-height: 100px; font-size: 2.4rem; border-radius: 18px; border: 4px solid #f0edf6; background: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #e7e3ef, 0 8px 14px rgba(0,0,0,.05); font-family: inherit;
}
.hunt-tile.found { background: #c8f7c5; border-color: #2ecc71; animation: pop .35s; }
.hunt-tile.missed { background: #eee; color: #bbb; animation: shake .35s; }
.circle, .hunt-tile .swatch { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(0,0,0,.12); display: block; }

/* build */
.build-slots { display: flex; gap: 8px; justify-content: center; margin: 18px 0; flex-wrap: wrap; }
.slot {
  min-width: 56px; height: 64px; padding: 0 10px; border-radius: 12px; border: 3px dashed #bbb; background: #fff;
  font-size: 1.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit;
}
.slot.filled { border-style: solid; border-color: var(--theme); background: var(--theme-soft); }
.slot.correct { background: #c8f7c5; border-color: #2ecc71; }
.slot.wrong { border-color: #ee5253; animation: shake .4s; }
.tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-width: 60px; height: 68px; font-size: 1.8rem; border-radius: 14px; border: none; background: #ffd166;
  cursor: pointer; box-shadow: 0 4px 0 #e0a92f; font-family: inherit; padding: 0 14px;
}
.tile:disabled { opacity: .25; box-shadow: none; }

/* feedback */
.feedback-overlay {
  position: fixed; inset: 0; background: rgba(255,255,255,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 50; animation: fadein .15s;
}
.feedback-emoji { font-size: 6rem; animation: pop .5s; }
.feedback-word { font-size: 2rem; font-weight: bold; color: var(--theme); margin-top: 8px; }
.level-up { font-size: 1.4rem; color: #e58e09; font-weight: bold; margin-top: 6px; }

/* summary + dashboard */
.summary-card, .dash-card { background: rgba(255,255,255,.92); border-radius: 26px; padding: 26px; box-shadow: 0 10px 28px rgba(93,63,152,.09); border: 1px solid rgba(255,255,255,.8); max-width: 640px; margin: 0 auto 18px; }
.summary-stars { font-size: 3rem; text-align: center; letter-spacing: 6px; }
.summary-msg { text-align: center; font-size: 1.4rem; margin: 10px 0; }
.method-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.chip { background: #f4f4f8; border-radius: 999px; padding: 8px 16px; font-size: 1rem; }
.dash-card { text-align: left; }
.dash-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.dash-head .icon { font-size: 2rem; }
.dash-head .name { font-size: 1.3rem; font-weight: bold; }
.level-pill { margin-left: auto; background: var(--theme-soft); color: var(--theme); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: bold; }
.bar-row { display: grid; grid-template-columns: 160px 1fr 110px; align-items: center; gap: 10px; margin: 6px 0; }
.bar { background: #eee; border-radius: 999px; height: 16px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #10ac84, #1dd1a1); }
.bar-label { font-size: .9rem; color: #666; }
.best-badge { color: #e58e09; }
.dash-note { color: #777; font-size: .95rem; line-height: 1.5; }
input.name-input, select { font-family: inherit; font-size: 1.05rem; padding: 10px 14px; border-radius: 12px; border: 2px solid #ddd; }
.settings-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.confetti { position: fixed; top: -40px; font-size: 1.8rem; animation: fall linear forwards; z-index: 60; pointer-events: none; }

/* piano keyboard */
.piano { display: flex; max-width: 640px; margin: 8px auto 0; height: 180px; border-radius: 0 0 14px 14px; overflow: hidden; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
.piano-key { flex: 1; background: #fff; border: 1px solid #bbb; border-top: none; border-radius: 0 0 10px 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font-size: 1.4rem; font-weight: bold; color: #555; cursor: pointer; user-select: none; -webkit-user-select: none; }
.piano-key:active { filter: brightness(.92); }
.piano-key.hit { background: #c8f7c5 !important; }
.piano-key.bad { background: #ffd6d6 !important; animation: shake .4s; }
.piano-key.target-flash { animation: pulse .5s 3; background: #ffe9a8 !important; }
.piano-replay { text-align: center; min-height: 10px; margin-bottom: 12px; }
.mini-spk { width: 40px; height: 40px; font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; vertical-align: middle; }
.opt-word { vertical-align: middle; }

/* tappable prompts replay their spoken instruction */
.speakable { cursor: pointer; border-radius: 14px; transition: background .15s; }
.speakable:active { background: var(--theme-soft); }

/* circled groups of ten for place-value counting (numbers game) */
.ten-group {
  display: inline-block; border: 3px dashed #ffb347; border-radius: 14px;
  padding: 3px 6px; margin: 3px; background: #fff8ec;
}
.ones-group { display: inline-block; margin: 3px; }

/* pre-reader friendly end-of-game buttons: icon-first, colour-coded */
.again-big, .home-big { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 34px; border-radius: 26px; }
.again-big { background: #ff9f43; box-shadow: 0 6px 0 #cc7a1e; animation: pulse 1.6s ease-in-out infinite; }
.again-big:active { transform: translateY(3px); box-shadow: 0 2px 0 #cc7a1e; }
.home-big { background: #fff; color: var(--theme); box-shadow: 0 6px 0 var(--theme-soft); }
.big-emoji { font-size: 3rem; line-height: 1; }
.btn-label { font-size: 1rem; }
.confetti.star { filter: drop-shadow(0 0 8px rgba(255, 193, 7, .9)); }

/* profiles */
.profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 10px; }
.profile-card { background: rgba(255,255,255,.92); border-radius: 24px; padding: 22px 10px; text-align: center; cursor: pointer; box-shadow: 0 10px 24px rgba(93,63,152,.09); border: 4px solid transparent; transition: transform .12s; animation: rise .3s ease backwards; }
.profile-card:nth-child(2) { animation-delay: .05s; }
.profile-card:nth-child(3) { animation-delay: .1s; }
.profile-card:nth-child(4) { animation-delay: .15s; }
.profile-card:nth-child(5) { animation-delay: .2s; }
.profile-card:hover { transform: translateY(-4px); }
.profile-card.add { border: 4px dashed var(--theme); color: var(--theme); }
.profile-avatar { font-size: 3.4rem; }
.profile-name { font-size: 1.2rem; font-weight: bold; margin-top: 6px; }
.profile-sub { color: #888; font-size: .85rem; }
.avatar-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; justify-content: center; }
.avatar-btn { font-size: 2rem; background: #fff; border: 3px solid #eee; border-radius: 14px; padding: 6px 10px; cursor: pointer; font-family: inherit; }
.avatar-btn.selected { border-color: var(--theme); background: var(--theme-soft); }
.switch-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--theme); text-decoration: underline; font-family: inherit; }
.mini-btn { font-family: inherit; border: none; cursor: pointer; border-radius: 10px; padding: 6px 12px; background: var(--theme-soft); color: var(--theme); font-size: .9rem; }
.btn.small { padding: 8px 14px; font-size: 1rem; }
.profile-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f6; flex-wrap: wrap; }
.skill-toggle { font-size: .9rem; background: #f4f4f8; border-radius: 999px; padding: 5px 12px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-family: inherit; }
.skill-toggle input { accent-color: var(--theme); width: 16px; height: 16px; cursor: pointer; }

@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.97); } }
@keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

</style>

  <div id="app" class="app"></div>
  <script>
// ===== speech.js =====
// Web Speech API wrapper — prefers a soft female voice; parents can override
// the choice from the dashboard (stored per device in settings).

let voice = null;
let preferredVoiceName = null;

// Ranked soft/female voices across platforms:
//   iOS/macOS: Serena, Kate, Stephanie, Martha, Shelley…
//   Chrome:    "Google UK English Female"
//   Windows:   Hazel (en-GB), Zira/Susan (en-US)
const FEMALE_PREFERENCES = [
  'serena', 'kate', 'stephanie', 'google uk english female', 'hazel',
  'shelley', 'sandy', 'flo', 'samantha', 'zira', 'susan', 'victoria',
  'moira', 'tessa', 'allison', 'ava', 'zoe', 'martha',
];

const isGB = v => /en[-_]GB/i.test(v.lang);

function findByHints(voices) {
  for (const hint of FEMALE_PREFERENCES) {
    const v = voices.find(x => x.name.toLowerCase().includes(hint));
    if (v) return v;
  }
  return null;
}

function speechAvailable() {
  return typeof window !== 'undefined' && 'speechSynthesis' in window;
}

function getVoices() {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices();
}

function pickVoice() {
  const vs = getVoices();
  if (!vs.length) return;
  // 1) parent's saved choice
  if (preferredVoiceName) {
    const chosen = vs.find(v => v.name === preferredVoiceName);
    if (chosen) { voice = chosen; return; }
  }
  // 2) British female first, then any soft female, then any British, then any English
  const gb = vs.filter(isGB);
  voice = findByHints(gb)
       || gb.find(v => /female|grandma|shelley|sandy|flo/i.test(v.name))
       || findByHints(vs)
       || vs.find(v => /female/i.test(v.name))
       || gb[0]
       || vs.find(v => /^en/i.test(v.lang))
       || vs[0];
}

function setVoicePreference(name) {
  preferredVoiceName = name || null;
  pickVoice();
}

// Browsers load voices asynchronously — let screens re-populate when they arrive
const voiceListeners = new Set();
function onVoicesChanged(fn) {
  voiceListeners.add(fn);
  return () => voiceListeners.delete(fn);
}

function handleVoicesChanged() {
  pickVoice();
  voiceListeners.forEach(fn => { try { fn(); } catch { /* listener gone */ } });
}

function currentVoiceName() { return voice ? voice.name : null; }

if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = handleVoicesChanged;
  if (window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', handleVoicesChanged);
  }
  // nudge browsers that defer loading the voice list (Chrome especially)
  getVoices();
  setTimeout(getVoices, 300);
}

// Emojis are for the screen only — strip them so the voice never reads out
// things like "glowing star" or "flexed biceps".
function stripEmoji(text) {
  return String(text)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Pick the nicest voice for another language (Spanish/French lessons),
// preferring a soft female voice when one exists on this device.
function voiceForLang(lang) {
  const prefix = String(lang).split('-')[0].toLowerCase();
  const vs = getVoices().filter(v => (v.lang || '').toLowerCase().startsWith(prefix));
  return findByHints(vs) || vs.find(v => /female/i.test(v.name)) || vs[0] || null;
}

function speak(text, opts = {}) {
  text = stripEmoji(text);
  if (!text || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
  if (!opts.onend) window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (opts.lang) {
    const lv = voiceForLang(opts.lang);
    if (lv) { u.voice = lv; u.lang = lv.lang; } else { u.lang = opts.lang; }
  } else if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-GB'; }
  u.rate = opts.rate ?? 0.85;    // gentle pace for little ears
  u.pitch = opts.pitch ?? 1.05;  // soft, warm tone
  if (opts.onend) u.onend = opts.onend;
  window.speechSynthesis.speak(u);
}

// Speak a sequence of parts, e.g. English instruction then a Spanish word:
//   speakSeq([{ text: 'Listen!' }, { text: 'gato', lang: 'es-ES' }])
function speakSeq(parts) {
  if (!speechAvailable() || !parts || !parts.length) return;
  window.speechSynthesis.cancel();
  const run = i => {
    if (i >= parts.length) return;
    speak(parts[i].text, { lang: parts[i].lang, onend: () => run(i + 1) });
  };
  run(0);
}

function stopSpeak() {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}

// ===== audio.js =====
// Web Audio: gentle piano-like tones for the piano module.
// Two oscillators (fundamental + soft octave harmonic) with a plucked envelope.

let ctx = null;

function audioCtx() {
  if (typeof window === 'undefined') return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    ctx = ctx || new AC();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  } catch { return null; }
}

function playNote(freq, dur = 0.8) {
  const c = audioCtx();
  if (!c) return;
  try {
    const t = c.currentTime;
    const gain = c.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const o1 = c.createOscillator();
    o1.type = 'triangle';
    o1.frequency.value = freq;

    const o2 = c.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = freq * 2;
    const g2 = c.createGain();
    g2.gain.value = 0.22;

    o1.connect(gain);
    o2.connect(g2);
    g2.connect(gain);
    gain.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  } catch { /* audio unavailable — ignore */ }
}

// Play a little tune: array of frequencies spaced by `gap` ms
function playNotes(freqs, gap = 600) {
  freqs.forEach((f, i) => setTimeout(() => playNote(f), i * gap));
}

const KEY = 'brightsteps.v2';
const OLD_KEY = 'brightsteps.v1'; // single-profile data from v1 is migrated

// localStorage with an in-memory fallback (also makes the engine testable in Node/JSC)
const mem = {};
const store = typeof localStorage !== 'undefined'
  ? localStorage
  : { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } };

function uid() { return 'p' + Math.random().toString(36).slice(2, 9); }

function fresh() {
  return { active: null, profiles: {}, settings: { override: null, voiceName: null } };
}

function migrateV1(old) {
  const id = uid();
  return {
    active: id,
    profiles: {
      [id]: {
        id,
        name: old.profile?.name || '',
        avatar: AVATARS[0],
        stats: old.stats || {},
        progress: old.progress || {},
        hiddenSkills: [],
        createdAt: Date.now(),
      },
    },
    settings: old.settings || { override: null },
  };
}

function load() {
  try {
    const s = JSON.parse(store.getItem(KEY));
    if (s && s.profiles) return s;
  } catch { /* fall through */ }
  try {
    const old = JSON.parse(store.getItem(OLD_KEY));
    if (old && old.profile) {
      const migrated = migrateV1(old);
      store.setItem(KEY, JSON.stringify(migrated));
      return migrated;
    }
  } catch { /* fall through */ }
  return fresh();
}

let state = load();
function save() { store.setItem(KEY, JSON.stringify(state)); }
function resetAll() { state = fresh(); save(); }

// ---------------- profiles ----------------
function listProfiles() { return Object.values(state.profiles); }
function activeProfile() { return state.profiles[state.active] || null; }

function addProfile(name, avatar) {
  const id = uid();
  state.profiles[id] = {
    id,
    name: (name || '').trim(),
    avatar: avatar || AVATARS[0],
    stats: {},
    progress: {},
    hiddenSkills: [],   // parent-controlled per-child module visibility
    createdAt: Date.now(),
  };
  state.active = id;
  save();
  return id;
}

function switchProfile(id) {
  if (state.profiles[id]) { state.active = id; save(); }
}

function updateProfile(id, patch) {
  const p = state.profiles[id];
  if (p) { Object.assign(p, patch); save(); }
}

function removeProfile(id) {
  if (!state.profiles[id]) return;
  delete state.profiles[id];
  if (state.active === id) state.active = listProfiles()[0]?.id || null;
  save();
}

// Is a skill shown on this child's home screen? (default: yes)
function isSkillVisible(profile, skillId) {
  const p = profile || activeProfile();
  if (!p) return true;
  return !(p.hiddenSkills || []).includes(skillId);
}

// Overall accuracy across all skills for one profile (or the active one)
function overallAccuracy(profile) {
  const p = profile || activeProfile();
  if (!p) return null;
  let answered = 0, correct = 0;
  for (const s of Object.values(p.progress)) {
    answered += s.answered || 0;
    correct += s.correct || 0;
  }
  return answered ? correct / answered : null;
}

// ---------------- adaptivity (always scoped to the active profile) ----------------
function getLevel(skill, maxLevel) {
  const p = activeProfile()?.progress[skill];
  return Math.min(p?.level || 1, maxLevel);
}

// Record one answer. 3 correct in a row => level up, 2 misses in a row => consolidate down.
function recordResult(skill, method, correct, maxLevel) {
  const prof = activeProfile();
  if (!prof) return null;

  const s = (prof.stats[skill] ||= {});
  const m = (s[method] ||= { attempts: 0, correct: 0 });
  m.attempts++;
  if (correct) m.correct++;

  const p = (prof.progress[skill] ||= { level: 1, streak: 0, wrong: 0, answered: 0, correct: 0 });
  p.answered++;
  let change = null;
  if (correct) {
    p.correct++; p.streak++; p.wrong = 0;
    if (p.streak >= 3 && p.level < maxLevel) { p.level++; p.streak = 0; change = 'up'; }
  } else {
    p.streak = 0; p.wrong++;
    if (p.wrong >= 2 && p.level > 1) { p.level--; p.wrong = 0; change = 'down'; }
  }
  save();
  return change;
}

function methodRate(skill, method) {
  const m = activeProfile()?.stats[skill]?.[method];
  if (!m || !m.attempts) return null;
  return m.correct / m.attempts;
}

// Weighted choice: (success rate)^2 + exploration floor. Unseen methods get a neutral 0.5
// so the app tries everything early, then converges on what works for this child.
// `allowed` optionally restricts the pool (e.g. language levels gate harder methods).
// A parent override outside the allowed pool is ignored.
function pickMethod(skill, allowed = METHODS) {
  const pool = METHODS.filter(m => allowed.includes(m));
  if (state.settings.override && pool.includes(state.settings.override)) return state.settings.override;
  const weights = pool.map(m => {
    const r = methodRate(skill, m);
    return r == null ? 0.5 : r * r + 0.12;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function bestMethod(skill) {
  let best = null, bestR = -1;
  for (const m of METHODS) {
    const r = methodRate(skill, m);
    if (r != null && r > bestR) { bestR = r; best = m; }
  }
  return best;
}

function skillAccuracy(skill) {
  const p = activeProfile()?.progress[skill];
  if (!p || !p.answered) return null;
  return p.correct / p.answered;
}

// How many sessions' worth of answers this skill has had (for Smart Session ordering)
function skillAnswered(skill) {
  return activeProfile()?.progress[skill]?.answered || 0;
}

// ===== activities.js =====
// ---------------------------------------------------------------------------
// Activity engine: generates a question for (skill, level, method) and runs
// sessions of rounds with feedback, stars and adaptive level changes.
//
// Question shapes (rendered by generic renderers):
//   choice: { type, prompt:{html,speak,text}, options:[{html,cls,value}], answer }
//   match:  { type, prompt:{text,speak}, pairs:[{left:{html,cls}, right:{html,cls}}] }
//   hunt:   { type, prompt:{html,speak,text}, tiles:[{html, match}] }
//   build:  { type, prompt:{html,speak,text}, tiles:[str], answer:[str] }
// ---------------------------------------------------------------------------

// ---------- small helpers ----------
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};
const sample = (a, n) => shuffle(a).slice(0, n);
const spkBtn = (text, big = false, lang = null) =>
  text ? `<button class="speaker${big ? ' big' : ''}" data-say="${encodeURIComponent(text)}"${lang ? ` data-lang="${lang}"` : ''} aria-label="Hear it">🔊</button>` : '';

// span version for use INSIDE option buttons (nested <button> is invalid HTML)
const spkMini = (text, lang = null) =>
  text ? `<span class="speaker mini-spk" data-say="${encodeURIComponent(text)}"${lang ? ` data-lang="${lang}"` : ''} role="button" aria-label="Hear it">🔊</span>` : '';

// Makes an element replay its spoken instruction when tapped
const speakable = (text, lang = null) =>
  text ? ` class="speakable" data-say="${encodeURIComponent(text)}"${lang ? ` data-lang="${lang}"` : ''}` : '';

// Auto-speak a prompt: bilingual sequence if present, else plain/lang speech
function speakPrompt(p) {
  if (!p) return;
  if (p.speakSeq) speakSeq(p.speakSeq);
  else if (p.speak) speak(p.speak, { lang: p.lang });
}

function nav(where) {
  stopSpeak();
  window.dispatchEvent(new CustomEvent('brightsteps:nav', { detail: where }));
}

// ---------- shared builders ----------
function answerOptions(ans, count = 3) {
  const set = new Set([ans]);
  for (const d of shuffle([1, -1, 2, -2, 3, -3, 10, -10])) {
    if (set.size >= count) break;
    const v = ans + d;
    if (v >= 0 && !set.has(v)) set.add(v);
  }
  let extra = ans + 4;
  while (set.size < count) { if (!set.has(extra)) set.add(extra); extra++; }
  return shuffle([...set]).map(v => ({ html: `${v}`, value: v }));
}

// Numbers shown as real circled groups of ten items + loose ones —
// no abstract key needed: children can see ten inside every circle and
// simply count in tens (10, 20, 30...) then count on the ones.
function blocksFor(n, big = false) {
  const tens = Math.floor(n / 10), ones = n % 10;
  const size = big ? (n > 12 ? '1rem' : '2.6rem') : (n > 12 ? '0.7rem' : '1.3rem');
  let s = '';
  if (tens) {
    const emo = pick(NUM_EMOJI);
    for (let i = 0; i < tens; i++) {
      s += `<span class="ten-group">${emo.repeat(10)}</span>`;
    }
  }
  if (ones) s += `<span class="ones-group">${pick(NUM_EMOJI).repeat(ones)}</span>`;
  if (!s) s = '<span style="font-size:1.1rem;color:#999">(none)</span>';
  return `<span class="mini" style="font-size:${size};line-height:1.9;display:inline-block;max-width:${big ? '640px' : '300px'}">${s}</span>`;
}

// ---------- numbers ----------
function numberPool(level) {
  if (level === 4) return [10, 20, 30, 40, 50, 60, 70, 80, 90];
  const ranges = { 1: [1, 5], 2: [0, 9], 3: [10, 20], 5: [0, 99] };
  const [a, b] = ranges[level];
  const out = [];
  for (let i = a; i <= b; i++) out.push(i);
  return out;
}

function genNumbers(level, method) {
  const pool = numberPool(level);
  const target = pick(pool);

  if (method === 'look') {
    return {
      type: 'choice',
      prompt: {
        html: `<div class="emoji-row">${blocksFor(target, true)}</div>`,
        text: 'How many can you see?',
        speak: level >= 4 ? 'How many? Count in tens!' : 'How many can you see?',
      },
      options: answerOptions(target), answer: target,
    };
  }
  if (method === 'hear') {
    return {
      type: 'choice',
      prompt: { html: '<div class="big-letter">👂</div>', text: 'Listen, then tap!', speak: `Tap the number ${target}.` },
      options: answerOptions(target), answer: target,
    };
  }
  if (method === 'match') {
    const nums = sample(pool, 3);
    return {
      type: 'match',
      prompt: { text: 'Match each number to its amount!', speak: 'Match the numbers to the amounts.' },
      pairs: nums.map(n => ({ left: { html: `${n}` }, right: { html: blocksFor(n) } })),
    };
  }
  // play → number hunt
  const others = pool.filter(n => n !== target);
  const tiles = shuffle([
    ...[0, 1, 2].map(() => ({ html: `${target}`, match: true })),
    ...sample(others, Math.min(6, others.length)).map(n => ({ html: `${n}`, match: false })),
  ]);
  return { type: 'hunt', prompt: { speak: `Tap every number ${target}.`, text: `Tap all the ${target}s!` }, tiles };
}

// ---------- maths ----------
function makeEq(level) {
  let a, b, op;
  if (level === 1) { a = rand(1, 4); b = rand(1, 5 - a); op = '+'; }
  else if (level === 2) { a = rand(1, 9); b = rand(0, 10 - a); op = '+'; }
  else if (level === 3) { a = rand(2, 10); b = rand(1, a); op = '−'; }
  else if (level === 4) {
    if (Math.random() < 0.5) { a = rand(2, 15); b = rand(1, 20 - a); op = '+'; }
    else { a = rand(5, 20); b = rand(1, a); op = '−'; }
  } else if (level === 5) {
    a = pick([2, 5, 10]); b = rand(1, 5);
    if (Math.random() < 0.5) [a, b] = [b, a];
    op = '×';
  } else if (level === 6) {
    b = pick([2, 5, 10]);
    const ans = rand(1, 5);
    return { a: b * ans, b, op: '÷', ans, text: `${b * ans} ÷ ${b}`, speak: `What is ${b * ans} divided by ${b}?` };
  } else { // level 7: missing number
    a = rand(1, 9);
    const ans = rand(1, 10 - a);
    const c = a + ans;
    if (Math.random() < 0.5) return { a, b: ans, op: '+', ans, missing: true, text: `${a} + ? = ${c}`, speak: `${a} add what makes ${c}?` };
    return { a: c, b: ans, op: '−', ans, missing: true, text: `${c} − ? = ${a}`, speak: `${c} take away what makes ${a}?` };
  }
  const ans = op === '+' ? a + b : op === '−' ? a - b : a * b;
  const word = op === '+' ? 'add' : op === '−' ? 'take away' : 'times';
  return { a, b, op, ans, text: `${a} ${op} ${b}`, speak: `What is ${a} ${word} ${b}?` };
}

function eqVisual(e) {
  if (e.missing || e.a > 12 || e.b > 12) return '';
  const emo = pick(NUM_EMOJI);
  if (e.op === '+') return `<div class="emoji-row" style="font-size:1.8rem">${emo.repeat(e.a)} ➕ ${emo.repeat(e.b)}</div>`;
  if (e.op === '−') return `<div class="emoji-row" style="font-size:1.8rem">${emo.repeat(e.a - e.b)}<span style="opacity:.35;text-decoration:line-through">${emo.repeat(e.b)}</span></div>`;
  if (e.op === '×' && e.a * e.b <= 20) {
    const groups = [];
    for (let i = 0; i < e.a; i++) groups.push(emo.repeat(e.b));
    return `<div class="emoji-row" style="font-size:1.4rem">${groups.join(' · ')}</div>`;
  }
  return '';
}

function genMaths(level, method) {
  const eq = makeEq(level);

  if (method === 'look' || method === 'hear') {
    const prompt = method === 'look'
      ? { html: `<div class="big-letter" style="font-size:3.2rem">${eq.text}${eq.missing ? '' : ' = ?'}</div>${eqVisual(eq)}`, text: 'What is the answer?', speak: eq.speak }
      : { html: '<div class="big-letter">👂</div>', text: 'Listen, then tap the answer!', speak: eq.speak };
    return { type: 'choice', prompt, options: answerOptions(eq.ans), answer: eq.ans };
  }
  if (method === 'match') {
    const eqs = []; const texts = new Set(); let guard = 0;
    while (eqs.length < 3 && guard++ < 300) {
      const e = makeEq(level);
      if (!texts.has(e.text)) { texts.add(e.text); eqs.push(e); }
    }
    return {
      type: 'match',
      prompt: { text: 'Match each sum to its answer!', speak: 'Match the sums to the answers.' },
      pairs: eqs.map(e => ({ left: { html: `${e.text}${e.missing ? '' : ' = ?'}`, cls: 'sentence-mini' }, right: { html: `${e.ans}` } })),
    };
  }
  // play → hunt all equations equal to a target
  let base = makeEq(level), guard = 0;
  while (base.missing && guard++ < 50) base = makeEq(level);
  if (base.missing) return genMaths(level, 'look');
  const target = base.ans;
  const texts = new Set([base.text]);
  const matchTiles = [{ html: base.text, match: true }];
  guard = 0;
  while (matchTiles.length < 3 && guard++ < 400) {
    const e = makeEq(level);
    if (!e.missing && e.ans === target && !texts.has(e.text)) { texts.add(e.text); matchTiles.push({ html: e.text, match: true }); }
  }
  if (matchTiles.length < 3) return genMaths(level, 'look');
  const otherTiles = []; guard = 0;
  while (otherTiles.length < 6 && guard++ < 400) {
    const e = makeEq(level);
    if (e.ans !== target && !texts.has(e.text)) { texts.add(e.text); otherTiles.push({ html: e.text, match: false }); }
  }
  if (otherTiles.length < 6) return genMaths(level, 'look');
  return {
    type: 'hunt',
    prompt: { speak: `Tap all the sums that make ${target}.`, text: `Tap all the sums that make ${target}!` },
    tiles: shuffle([...matchTiles, ...otherTiles]),
  };
}

// ---------- letters ----------
function genLetters(level, method) {
  const pool = LETTER_LEVELS[level].split('');
  const target = pick(pool);
  const others = pool.filter(l => l !== target);

  if (method === 'look') {
    const upper = level >= 5 && Math.random() < 0.5;
    const options = shuffle([target, ...sample(others, 3)])
      .map(l => ({ html: upper ? l.toUpperCase() : l, value: l }));
    return {
      type: 'choice',
      prompt: {
        html: `<div class="big-letter">${upper ? target.toUpperCase() : target}</div>`,
        text: 'Find the matching letter!', speak: `Find the letter ${target}.`,
      },
      options, answer: target,
    };
  }
  if (method === 'hear') {
    const options = shuffle([target, ...sample(others, 3)]).map(l => ({ html: l, value: l }));
    return {
      type: 'choice',
      prompt: { html: '<div class="big-letter">👂</div>', text: 'Listen, then tap the letter!', speak: `Tap the letter ${target}.` },
      options, answer: target,
    };
  }
  if (method === 'match') {
    if (level >= 5) {
      const letters = sample(pool, 3);
      return {
        type: 'match',
        prompt: { text: 'Match the big and small letters!', speak: 'Match the big letters to the small letters.' },
        pairs: letters.map(l => ({ left: { html: l.toUpperCase() }, right: { html: l } })),
      };
    }
    const letters = sample(pool.filter(l => LETTER_EMOJI[l]), 3);
    return {
      type: 'match',
      prompt: { text: 'Match each letter to its picture!', speak: 'Match the letters to the pictures.' },
      pairs: letters.map(l => ({ left: { html: l }, right: { html: LETTER_EMOJI[l] } })),
    };
  }
  // play → letter hunt
  const useUpper = level >= 5 && Math.random() < 0.5;
  const show = l => (useUpper ? l.toUpperCase() : l);
  const tiles = shuffle([
    ...[0, 1, 2].map(() => ({ html: show(target), match: true })),
    ...sample(others, 6).map(l => ({ html: show(l), match: false })),
  ]);
  return { type: 'hunt', prompt: { speak: `Tap all the letter ${target}.`, text: `Tap all the '${show(target)}' letters!` }, tiles };
}

// ---------- SATPIN words ----------
function genWords(level, method) {
  const pool = WORD_LEVELS[level];
  const withEmoji = pool.filter(w => WORD_EMOJI[w]);

  if (method === 'look') {
    // read the word (no audio giveaway), then choose the matching picture
    const target = pick(withEmoji);
    const options = shuffle([target, ...sample(withEmoji.filter(w => w !== target), 2)])
      .map(w => ({ html: WORD_EMOJI[w], value: w }));
    return {
      type: 'choice',
      prompt: { html: `<div class="word">${target}</div>`, text: 'Sound it out, then tap the picture!', speak: 'Sound out the word, then tap the picture.' },
      options, answer: target,
    };
  }
  if (method === 'hear') {
    const target = pick(pool);
    const sameLen = pool.filter(w => w !== target && w.length === target.length);
    const distract = sample(sameLen.length >= 2 ? sameLen : pool.filter(w => w !== target), 2);
    const options = shuffle([target, ...distract]).map(w => ({ html: w, value: w, cls: 'word-option' }));
    return {
      type: 'choice',
      prompt: { html: '<div class="big-letter">👂</div>', text: 'Listen, then tap the word!', speak: `Tap the word ${target}.` },
      options, answer: target,
    };
  }
  if (method === 'match') {
    const words = sample(withEmoji, 3);
    return {
      type: 'match',
      prompt: { text: 'Match each word to its picture!', speak: 'Read each word and match it to the picture.' },
      pairs: words.map(w => ({ left: { html: w, cls: 'sentence-mini' }, right: { html: WORD_EMOJI[w] } })),
    };
  }
  // play → build the word from letter tiles
  const target = pick(pool);
  return {
    type: 'build',
    prompt: {
      html: WORD_EMOJI[target] ? `<div class="emoji-row">${WORD_EMOJI[target]}</div>` : '<div class="big-letter">👂</div>',
      speak: `Spell the word ${target}.`,
      text: 'Tap the letters to build the word!',
    },
    tiles: target.split(''), answer: target.split(''),
  };
}

// ---------- colours ----------
function genColours(level, method) {
  const names = COLOUR_LEVELS[level];
  const swatch = n => `<span class="swatch" style="background:${COLOURS[n]}"></span>`;
  const target = pick(names);

  if (method === 'look' || method === 'hear') {
    const options = shuffle([target, ...sample(names.filter(n => n !== target), 3)])
      .map(n => ({ html: swatch(n), value: n, cls: 'swatch-option' }));
    const prompt = method === 'look'
      ? {
          // the word is always plain dark grey — never printed in its own colour,
          // so the child can't just match the ink to the swatch
          html: `<div class="word" style="color:#333">${target}</div>`,
          text: 'Find this colour!', speak: `Find the colour ${target}.`,
        }
      : { html: '<div class="big-letter">👂</div>', text: 'Listen, then tap the colour!', speak: `Tap the colour ${target}.` };
    return { type: 'choice', prompt, options, answer: target };
  }
  if (method === 'match') {
    const cols = sample(names, 3);
    return {
      type: 'match',
      prompt: {
        text: level >= 4 ? 'Match each colour to its name!' : 'Match the same colours!',
        speak: level >= 4 ? 'Match the colours to their names.' : 'Match the colours that are the same.',
      },
      pairs: cols.map(n => (level >= 4
        ? { left: { html: swatch(n) }, right: { html: n, cls: 'sentence-mini' } }
        : { left: { html: swatch(n) }, right: { html: swatch(n) } })),
    };
  }
  // play → colour hunt
  const otherNames = names.filter(n => n !== target);
  const tiles = shuffle([
    ...[0, 1, 2].map(() => ({ html: swatch(target), match: true })),
    ...[0, 1, 2, 3, 4, 5].map(() => ({ html: swatch(pick(otherNames)), match: false })),
  ]);
  return { type: 'hunt', prompt: { speak: `Tap all the ${target} ones.`, text: `Tap all the ${target} ones!` }, tiles };
}

// ---------- reading (UK book bands) ----------
function genReading(level, method) {
  const band = READING_BANDS[level - 1];
  const item = pick(band.items);

  if (band.wordless) {
    if (method === 'match') {
      return {
        type: 'match',
        prompt: { text: 'Match the same pictures!', speak: 'Match the pictures that are the same.' },
        pairs: item.opts.map(e => ({ left: { html: e }, right: { html: e } })),
      };
    }
    if (method === 'play') {
      const tgt = item.opts[item.a];
      const others = EMOJI_POOL.filter(e => !item.opts.includes(e));
      const tiles = shuffle([
        ...[0, 1, 2].map(() => ({ html: tgt, match: true })),
        ...sample(others, 6).map(e => ({ html: e, match: false })),
      ]);
      return { type: 'hunt', prompt: { speak: item.huntSpeak, text: item.huntSpeak }, tiles };
    }
    const options = shuffle(item.opts.map((e, i) => ({ html: e, value: i })));
    return { type: 'choice', prompt: { html: `<div class="emoji-row">${item.scene}</div>`, text: item.q, speak: item.q }, options, answer: item.a };
  }

  if (method === 'match') {
    const items = sample(band.items, 3);
    return {
      type: 'match',
      prompt: { text: 'Match each sentence to its picture!', speak: 'Read each sentence and match it to the picture.' },
      pairs: items.map(it => ({ left: { html: it.text, cls: 'sentence-mini' }, right: { html: it.opts[it.a] } })),
    };
  }
  if (method === 'play') {
    const words = item.text.replace(/[.!?]$/, '').split(' ');
    return {
      type: 'build',
      prompt: { html: `<div class="emoji-row">${item.opts[item.a]}</div>`, speak: item.text, text: 'Listen, then build the sentence!' },
      tiles: words, answer: words,
    };
  }
  const options = shuffle(item.opts.map((e, i) => ({ html: e, value: i })));
  if (method === 'hear') {
    return {
      type: 'choice',
      prompt: { html: '<div class="big-letter">👂</div>', text: item.q, speak: `${item.text} ${item.q}` },
      options, answer: item.a,
    };
  }
  // look: child reads the sentence (audio only on request); the question is spoken.
  // The sentence card itself is tappable to hear the sentence read aloud.
  return {
    type: 'choice',
    prompt: { html: `<div class="sentence-card speakable" data-say="${encodeURIComponent(item.text)}">${item.text} ${spkBtn(item.text)}</div>`, text: item.q, speak: item.q },
    options, answer: item.a,
  };
}

// ---------- dispatcher ----------
// ---------- languages (Spanish / French) ----------
function genLanguage(level, method, content) {
  const L = content.lang;
  const items = content.levels[level];
  const target = pick(items);
  const others = items.filter(i => i !== target);
  const visual = it => it.colour
    ? `<span class="swatch" style="background:${it.colour}"></span>`
    : (it.num != null ? `${it.num}` : it.emoji);
  const bigVisual = it => it.colour
    ? `<span class="swatch" style="background:${it.colour};width:110px;height:110px"></span>`
    : (it.num != null ? `<div class="emoji-row">${pick(NUM_EMOJI).repeat(it.num)}</div>` : `<div class="emoji-row">${it.emoji}</div>`);

  if (method === 'look') {
    // picture/count/colour shown; choose the matching word (options can be heard first)
    // level 1: just 2 choices so brand-new learners build confidence
    const options = shuffle([target, ...sample(others, level === 1 ? 1 : 2)]).map(it => ({
      html: `<span class="opt-word">${it.w}</span>${spkMini(it.w, L)}`,
      value: it.w, cls: 'word-option',
    }));
    // number items show a row of things to count, so ask for counting instead
    const isNum = target.num != null;
    return {
      type: 'choice',
      prompt: isNum
        ? { html: bigVisual(target), text: 'Count and tell me the number!', speak: 'Count the pictures, and tell me the number!' }
        : { html: bigVisual(target), text: 'Tap the word that matches!', speak: 'Tap the word that matches the picture.' },
      options, answer: target.w,
    };
  }
  if (method === 'hear') {
    const options = shuffle([target, ...sample(others, level === 1 ? 1 : 2)]).map(it => ({
      html: visual(it), value: it.w, cls: it.colour ? 'swatch-option' : '',
    }));
    return {
      type: 'choice',
      prompt: {
        html: '<div class="big-letter">👂</div>', text: 'Listen, then tap!',
        speak: target.w, lang: L,
        // little ears need repetition: instruction, then the word twice
        speakSeq: [{ text: 'Listen, then tap what you hear!' }, { text: target.w, lang: L }, { text: target.w, lang: L }],
      },
      options, answer: target.w,
    };
  }
  if (method === 'match') {
    const three = sample(items, 3);
    return {
      type: 'match',
      prompt: { text: 'Match each word to its picture!', speak: 'Match the words to the pictures. Tap a word to hear it!' },
      pairs: three.map(it => ({
        left: { html: it.w, cls: 'sentence-mini', say: it.w, lang: L },
        right: { html: visual(it) },
      })),
    };
  }
  // play → build the word from letter tiles (short single words only —
  // long spellings like "caballo" are too hard for emergent writers)
  let buildPool = items.filter(i => !i.w.includes(' ') && !i.w.includes("'") && i.w.length <= 5);
  if (!buildPool.length) buildPool = items.filter(i => !i.w.includes(' ') && !i.w.includes("'"));
  const t = buildPool.includes(target) ? target : pick(buildPool);
  return {
    type: 'build',
    prompt: {
      html: bigVisual(t),
      text: 'Build the word!',
      speak: t.w, lang: L,
      speakSeq: [{ text: `Build the word for ${t.en}!` }, { text: t.w, lang: L }],
    },
    tiles: t.w.split(''), answer: t.w.split(''),
  };
}

// ---------- piano ----------
function pianoKeysFor(level) {
  const names = PIANO_LEVEL_NOTES[level];
  const octaves = level >= 4 ? 2 : 1;
  const keys = [];
  for (let o = 0; o < octaves; o++) {
    names.forEach(n => keys.push({ n, freq: PIANO_OCTAVES[o][n], colour: NOTE_COLOURS[n] }));
  }
  return keys;
}

function genPiano(level, method) {
  const keys = pianoKeysFor(level);
  const names = PIANO_LEVEL_NOTES[level];
  if (method === 'match') {
    const notes = sample(names, 3);
    return {
      type: 'match',
      prompt: { text: 'Match each note to its colour!', speak: 'Match the notes to their colours.' },
      pairs: notes.map(n => ({
        left: { html: n },
        right: { html: `<span class="swatch" style="background:${NOTE_COLOURS[n]}"></span>` },
      })),
    };
  }
  if (method === 'play') {
    const len = level === 1 ? 2 : level <= 3 ? 3 : 4;
    const sequence = Array.from({ length: len }, () => pick(names));
    return {
      type: 'piano', mode: 'copy', keys, sequence, labelKeys: level <= 2,
      prompt: { text: 'Listen, then copy my tune!', speak: 'Listen to my tune, then copy it!' },
    };
  }
  const target = pick(names);
  if (method === 'hear') {
    return {
      type: 'piano', mode: 'find', keys, target, hearOnly: true, labelKeys: level <= 2,
      prompt: { text: 'Listen, then find the note!', speak: 'Listen to the note, then find it on the piano!' },
    };
  }
  return {
    type: 'piano', mode: 'find', keys, target, labelKeys: level <= 2,
    prompt: { html: `<div class="big-letter">${target}</div>`, text: 'Find this key!', speak: `Find the key ${target}.` },
  };
}

function generateRound(skillId, level, method) {
  switch (skillId) {
    case 'numbers': return genNumbers(level, method);
    case 'maths':   return genMaths(level, method);
    case 'letters': return genLetters(level, method);
    case 'words':   return genWords(level, method);
    case 'colours': return genColours(level, method);
    case 'reading': return genReading(level, method);
    case 'piano':   return genPiano(level, method);
    case 'spanish': return genLanguage(level, method, LANG_CONTENT.spanish);
    case 'french':  return genLanguage(level, method, LANG_CONTENT.french);
    default: throw new Error(`Unknown skill: ${skillId}`);
  }
}

// ---------- renderers ----------
function renderChoice(host, q, onDone) {
  host.innerHTML = `
    <div class="prompt"><div${speakable(q.prompt.speak, q.prompt.lang)}>
      ${q.prompt.html || ''}
      ${q.prompt.speak ? spkBtn(q.prompt.speak, false, q.prompt.lang) : ''}
      <div class="prompt-text">${q.prompt.text || ''}</div>
    </div></div>
    <div class="options">
      ${q.options.map((o, i) => `<button class="option ${o.cls || ''}" data-i="${i}">${o.html}</button>`).join('')}
    </div>`;
  speakPrompt(q.prompt);

  let answered = false;
  host.querySelectorAll('.option').forEach(btn => {
    btn.onclick = e => {
      if (e.target.closest('[data-say]')) return; // tapped a 🔊 inside the option — hear it, don't answer
      if (answered) return;
      answered = true;
      const o = q.options[+btn.dataset.i];
      if (o.value === q.answer) {
        btn.classList.add('correct');
        setTimeout(() => onDone(true), 1000);
      } else {
        btn.classList.add('wrong');
        host.querySelectorAll('.option').forEach(b => {
          if (q.options[+b.dataset.i].value === q.answer) b.classList.add('correct');
        });
        setTimeout(() => onDone(false), 1900);
      }
    };
  });
}

function renderMatch(host, q, onDone) {
  const cards = shuffle(q.pairs.flatMap((p, i) => [
    { html: p.left.html, cls: p.left.cls || '', say: p.left.say, lang: p.left.lang, pair: i },
    { html: p.right.html, cls: p.right.cls || '', say: p.right.say, lang: p.right.lang, pair: i },
  ]));
  host.innerHTML = `
    <div class="prompt"><div${speakable(q.prompt.speak, q.prompt.lang)}><div class="prompt-text">${q.prompt.text || 'Match the pairs!'}</div></div></div>
    <div class="match-grid">
      ${cards.map((c, i) => `<button class="match-card ${c.cls}" data-i="${i}"${c.say ? ` data-say="${encodeURIComponent(c.say)}" data-lang="${c.lang || ''}"` : ''}>${c.html}</button>`).join('')}
    </div>`;
  speakPrompt(q.prompt);

  let sel = null, matched = 0, errors = 0;
  host.querySelectorAll('.match-card').forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains('matched') || btn === sel) return;
      if (!sel) { sel = btn; btn.classList.add('selected'); return; }
      const a = cards[+sel.dataset.i], b = cards[+btn.dataset.i];
      if (a.pair === b.pair) {
        sel.classList.remove('selected');
        sel.classList.add('matched');
        btn.classList.add('matched');
        sel = null;
        matched++;
        if (matched === q.pairs.length) setTimeout(() => onDone(errors <= 1), 900);
      } else {
        errors++;
        const s = sel; sel = null;
        s.classList.remove('selected');
        s.classList.add('wrong');
        btn.classList.add('wrong');
        setTimeout(() => { s.classList.remove('wrong'); btn.classList.remove('wrong'); }, 650);
      }
    };
  });
}

function renderHunt(host, q, onDone) {
  const total = q.tiles.filter(t => t.match).length;
  // When speech is available the target is AUDIO-ONLY (big 🔊 replay button),
  // so children must listen/remember rather than shape-match the text.
  // The written prompt is the fallback for devices without sound.
  const listening = !!q.prompt.speak && speechAvailable();
  host.innerHTML = `
    <div class="prompt"><div${speakable(q.prompt.speak, q.prompt.lang)}>
      ${q.prompt.html || ''}
      ${listening ? spkBtn(q.prompt.speak, true, q.prompt.lang) : ''}
      ${listening ? '' : `<div class="prompt-text">${q.prompt.text || ''}</div>`}
    </div></div>
    <div class="hunt-grid">
      ${q.tiles.map((t, i) => `<button class="hunt-tile" data-i="${i}">${t.html}</button>`).join('')}
    </div>`;
  speakPrompt(q.prompt);

  let found = 0, errors = 0, finished = false;
  host.querySelectorAll('.hunt-tile').forEach(btn => {
    btn.onclick = () => {
      if (finished) return;
      const t = q.tiles[+btn.dataset.i];
      if (t.done) return;
      t.done = true;
      if (t.match) {
        btn.classList.add('found');
        found++;
        if (found === total) { finished = true; setTimeout(() => onDone(errors <= 1), 900); }
      } else {
        btn.classList.add('missed');
        errors++;
      }
    };
  });
}

function renderBuild(host, q, onDone) {
  host.innerHTML = `
    <div class="prompt"><div${speakable(q.prompt.speak, q.prompt.lang)}>
      ${q.prompt.html || ''}
      ${q.prompt.speak ? spkBtn(q.prompt.speak, true, q.prompt.lang) : ''}
      <div class="prompt-text">${q.prompt.text || ''}</div>
    </div></div>
    <div class="build-slots"></div>
    <div class="tiles"></div>`;
  speakPrompt(q.prompt);

  const slotsEl = host.querySelector('.build-slots');
  const tilesEl = host.querySelector('.tiles');
  const tiles = shuffle(q.tiles.map((t, i) => ({ t, id: i, used: false })));
  let slots = [], attempts = 0, finished = false;

  function draw() {
    slotsEl.innerHTML = q.answer.map((_, i) =>
      `<button class="slot ${slots[i] ? 'filled' : ''}" data-i="${i}">${slots[i] ? slots[i].t : '&nbsp;'}</button>`).join('');
    tilesEl.innerHTML = tiles.map(t =>
      `<button class="tile" data-id="${t.id}" ${t.used ? 'disabled' : ''}>${t.t}</button>`).join('');
  }
  draw();

  host.onclick = e => {
    if (e.target.closest('.speaker')) return; // handled by global listener
    const tileBtn = e.target.closest('.tile');
    if (tileBtn && !tileBtn.disabled && !finished) {
      const t = tiles.find(x => x.id === +tileBtn.dataset.id);
      t.used = true;
      slots.push(t);
      draw();
      check();
      return;
    }
    const slotBtn = e.target.closest('.slot');
    if (slotBtn && !finished) {
      const i = +slotBtn.dataset.i;
      if (slots[i]) { slots[i].used = false; slots.splice(i, 1); draw(); }
    }
  };

  function check() {
    if (slots.length < q.answer.length) return;
    const ok = slots.every((s, i) => s.t === q.answer[i]);
    if (ok) {
      finished = true;
      slotsEl.querySelectorAll('.slot').forEach(s => s.classList.add('correct'));
      setTimeout(() => onDone(true), 1000);
    } else {
      attempts++;
      slotsEl.querySelectorAll('.slot').forEach(s => s.classList.add('wrong'));
      setTimeout(() => {
        if (attempts >= 2) {
          finished = true;
          onDone(false);
        } else {
          slots.forEach(s => { s.used = false; });
          slots = [];
          draw();
        }
      }, 900);
    }
  }
}

// ---------- piano renderer ----------
function renderPiano(host, q, onDone) {
  host.innerHTML = `
    <div class="prompt"><div${speakable(q.prompt.speak)}>
      ${q.prompt.html || ''}
      ${q.prompt.speak ? spkBtn(q.prompt.speak) : ''}
      <div class="prompt-text">${q.prompt.text || ''}</div>
    </div></div>
    <div class="piano-replay">
      ${q.mode === 'copy' ? '<button class="btn secondary" id="replayBtn">🎵 Hear the tune</button>' : ''}
      ${q.hearOnly ? '<button class="btn secondary" id="replayBtn">🎵 Hear the note</button>' : ''}
    </div>
    <div class="piano">
      ${q.keys.map((k, i) => `<div class="piano-key" data-i="${i}" data-note="${k.n}" style="background:${k.colour};color:${NOTE_TEXT[k.n]}">${q.labelKeys ? k.n : ''}</div>`).join('')}
    </div>`;

  const keyEls = [...host.querySelectorAll('.piano-key')];
  const keyFreq = n => q.keys.find(k => k.n === n).freq;
  const playTune = () => playNotes(q.sequence.map(keyFreq), 600);

  // Play notes only AFTER the spoken instruction finishes, so they never overlap.
  // (Safety-net timer covers devices where speech is unavailable or onend doesn't fire.)
  const startPlayback = () => {
    if (q.mode === 'copy') playTune();
    else if (q.hearOnly) playNote(keyFreq(q.target));
  };
  if (q.mode === 'copy' || q.hearOnly) {
    let played = false;
    const start = () => { if (!played) { played = true; startPlayback(); } };
    if (q.prompt.speak && speechAvailable()) {
      stopSpeak(); // clear any leftover praise/instruction from the previous screen
      speak(q.prompt.speak, { onend: () => setTimeout(start, 300) });
      setTimeout(start, 4500); // safety net
    } else {
      setTimeout(start, 600);
    }
  } else {
    speakPrompt(q.prompt);
  }

  const replay = host.querySelector('#replayBtn');
  if (replay) replay.onclick = () => { if (q.mode === 'copy') playTune(); else playNote(keyFreq(q.target)); };

  if (q.mode === 'find') {
    let answered = false;
    keyEls.forEach(el => {
      el.onclick = () => {
        const k = q.keys[+el.dataset.i];
        playNote(k.freq);
        if (answered) return;
        answered = true;
        if (k.n === q.target) {
          el.classList.add('hit');
          setTimeout(() => onDone(true), 1000);
        } else {
          el.classList.add('bad');
          keyEls.filter(e => e.dataset.note === q.target).forEach(e => e.classList.add('target-flash'));
          setTimeout(() => playNote(keyFreq(q.target)), 700); // let them hear the right note
          setTimeout(() => onDone(false), 2000);
        }
      };
    });
  } else {
    // copy mode: repeat the tune note-by-note; a mistake restarts the sequence
    let idx = 0, errors = 0, finished = false;
    keyEls.forEach(el => {
      el.onclick = () => {
        const k = q.keys[+el.dataset.i];
        playNote(k.freq);
        if (finished) return;
        if (k.n === q.sequence[idx]) {
          el.classList.add('hit');
          setTimeout(() => el.classList.remove('hit'), 450);
          idx++;
          if (idx === q.sequence.length) { finished = true; setTimeout(() => onDone(errors === 0), 1000); }
        } else {
          errors++;
          el.classList.add('bad');
          setTimeout(() => el.classList.remove('bad'), 500);
          idx = 0;
          setTimeout(playTune, 1100); // hear it again and retry
        }
      };
    });
  }
}

const RENDER = { choice: renderChoice, match: renderMatch, hunt: renderHunt, build: renderBuild, piano: renderPiano };

// ---------- session runner ----------
const PRAISE = ['Well done!', 'Amazing!', 'Super star!', 'Brilliant!', 'You did it!'];
const CHEER = ['Good try!', 'Nearly there!', 'Keep going!'];

let session = null;

function startSession(skillId, rounds = 5) {
  if (!activeProfile()) { nav('profiles'); return; } // must know who is learning
  session = { skillId, round: 0, rounds, stars: 0, methods: {} };
  renderRound();
}

function renderRound() {
  const app = document.getElementById('app');
  const skill = SKILLS[session.skillId];
  const level = getLevel(session.skillId, skill.maxLevel);
  // language skills unlock harder methods as the child levels up
  const gates = (session.skillId === 'spanish' || session.skillId === 'french') ? LANG_METHOD_GATES[level] : undefined;
  const method = pickMethod(session.skillId, gates);
  const q = generateRound(session.skillId, level, method);
  session.current = { method, level };
  const mm = METHOD_META[method];

  app.innerHTML = `
    <div class="topbar">
      <button class="home-btn" id="homeBtn">🏠</button>
      <div class="session-title">${skill.icon} ${skill.name}</div>
      <div class="round-pill">⭐ ${session.stars} · ${session.round + 1}/${session.rounds}</div>
    </div>
    <div class="method-tag-wrap"><span class="method-tag">${mm.icon} ${mm.name} · Level ${level} (${skill.levelNames[level - 1]})</span></div>
    <div id="qhost"></div>`;
  document.getElementById('homeBtn').onclick = () => nav('home');
  RENDER[q.type](document.getElementById('qhost'), q, done);
}

function done(correct) {
  const { method, level } = session.current;
  const change = recordResult(session.skillId, method, correct, SKILLS[session.skillId].maxLevel);
  const rec = (session.methods[method] ||= { a: 0, c: 0 });
  rec.a++;
  if (correct) { rec.c++; session.stars++; }
  showFeedback(correct, change, () => {
    session.round++;
    if (session.round >= session.rounds) renderSummary();
    else renderRound();
  });
}

function showFeedback(correct, change, cb) {
  const o = document.createElement('div');
  o.className = 'feedback-overlay';
  const word = correct ? pick(PRAISE) : pick(CHEER);
  o.innerHTML = `
    <div class="feedback-emoji">${correct ? '🌟' : '💪'}</div>
    <div class="feedback-word">${word}</div>
    ${change === 'up' ? '<div class="level-up">⬆️ Level up! Amazing!</div>' : ''}`;
  document.body.appendChild(o);
  speak(correct ? word : (change === 'down' ? "Let's try something a little easier." : word));
  setTimeout(() => { o.remove(); cb(); }, change === 'up' ? 2100 : 1400);
}

function renderSummary() {
  const app = document.getElementById('app');
  const skill = SKILLS[session.skillId];
  const { stars, rounds } = session;
  const msg = stars === rounds ? 'Perfect! You are a superstar! 🌟'
    : stars >= rounds / 2 ? 'Great work! Keep it up! 💪'
    : 'Good try! Practice makes perfect! 🌱';
  // Child-facing summary: stars + celebration + big friendly buttons only.
  // (Method results live in the Parent Dashboard.)
  const skillId = session.skillId;

  app.innerHTML = `
    <div class="summary-card">
      <div class="summary-stars">${'⭐'.repeat(stars)}${'☆'.repeat(rounds - stars)}</div>
      <div class="summary-msg">${msg}</div>
      <div class="btn-row">
        <button class="btn again-big" id="againBtn" aria-label="Play again">
          <span class="big-emoji">🔁</span><span class="btn-label">Play again</span>
        </button>
        <button class="btn secondary home-big" id="homeBtn" aria-label="Home">
          <span class="big-emoji">🏠</span><span class="btn-label">Home</span>
        </button>
      </div>
    </div>`;
  if (stars === rounds) starRain(); else confetti();
  speak(`${msg} Tap the big orange button to play again, or tap the house to try something else.`);
  document.getElementById('againBtn').onclick = () => startSession(skillId);
  document.getElementById('homeBtn').onclick = () => nav('home');
}

function confetti() {
  const emos = ['🎉', '⭐', '🌟', '✨', '🎈'];
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = pick(emos);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    s.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
}

// Perfect score (5/5): a sky full of glowing stars rains down over ~5 seconds
function starRain() {
  const emos = ['⭐', '🌟', '✨', '💫'];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('span');
    s.className = 'confetti star';
    s.textContent = pick(emos);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDelay = (Math.random() * 2.5) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    s.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 8000);
  }
}

// ===== screens.js =====
// Screens: profile picker, profile creation, home, parent dashboard.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function nav(where) {
  window.dispatchEvent(new CustomEvent('brightsteps:nav', { detail: where }));
}

// Re-colour the whole app to match a child's avatar (or the default purple).
function applyTheme(theme) {
  const t = theme || themeFor(activeProfile()?.avatar);
  const root = document.documentElement.style;
  root.setProperty('--theme', t.c);
  root.setProperty('--theme-dark', t.dark);
  root.setProperty('--theme-soft', t.soft);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.c);
}

let unsubscribeVoices = null;

function refreshVoiceList() {
  const vsel = document.getElementById('voiceSel');
  if (!vsel) return; // dashboard not open any more
  const current = state.settings.voiceName || '';
  vsel.innerHTML = `<option value="">🎀 Soft female (automatic)</option>${voiceOptions()}`;
  vsel.value = current;
}

function subscribeVoiceList() {
  if (unsubscribeVoices) unsubscribeVoices();
  unsubscribeVoices = onVoicesChanged(refreshVoiceList);
}

// Voices offered in the dashboard: just Daniel (British male) — the soft
// female voice is the automatic default. Other voices stay hidden to keep
// the choice simple.
function voiceOptions() {
  const daniel = getVoices().filter(v => /daniel/i.test(v.name));
  return daniel.map(v =>
    `<option value="${esc(v.name)}" ${state.settings.voiceName === v.name ? 'selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('');
}

// ---------------- home ----------------
function renderHome() {
  const prof = activeProfile();
  if (!prof) { renderProfiles(); return; }
  applyTheme();

  const app = document.getElementById('app');
  app.innerHTML = `
    <h1 class="app-title">🌈 Bright Steps</h1>
    <p class="tagline">Learn your way!</p>
    <p class="greeting">${prof.avatar} Hello, <b>${esc(prof.name || 'friend')}</b>!
      <button class="switch-btn" id="switchBtn" title="Switch child">👋 Bye</button>
    </p>
    <button class="btn smart-btn" id="smartBtn">✨ Smart Session</button>
    <div class="skill-grid">
      ${Object.values(SKILLS).filter(sk => isSkillVisible(prof, sk.id)).map(sk => {
        const lvl = getLevel(sk.id, sk.maxLevel);
        const acc = skillAccuracy(sk.id);
        return `
          <div class="skill-card" style="--c:${sk.colour}" data-id="${sk.id}">
            <div class="skill-icon">${sk.icon}</div>
            <div class="skill-name">${sk.name}</div>
            <div class="skill-level">Level ${lvl} · ${sk.levelNames[lvl - 1]}</div>
            <div class="skill-level">${acc == null ? 'Not played yet' : `Accuracy ${Math.round(acc * 100)}%`}</div>
          </div>`;
      }).join('')}
    </div>
    <p class="parent-link"><button class="parent-gate-link" id="parentBtn">🔒 Grown-ups</button></p>`;

  document.querySelectorAll('.skill-card').forEach(card => {
    card.onclick = () => startSession(card.dataset.id);
  });
  document.getElementById('smartBtn').onclick = () => startSession(pickSmartSkill());
  document.getElementById('parentBtn').onclick = () => renderParentGate();
  document.getElementById('switchBtn').onclick = () => nav('profiles');
}

// Smart Session: prioritise the least-practised skill, then the lowest accuracy.
// (Only skills the parent has left visible for this child are considered.)
function pickSmartSkill() {
  const visible = Object.keys(SKILLS).filter(id => isSkillVisible(null, id));
  return visible.sort((a, b) => {
    const aa = skillAnswered(a), ab = skillAnswered(b);
    if (aa !== ab) return aa - ab;
    return (skillAccuracy(a) ?? 0.5) - (skillAccuracy(b) ?? 0.5);
  })[0];
}

// ---------------- profile picker ----------------
function renderProfiles() {
  applyTheme(DEFAULT_THEME); // neutral colour while nobody is picked
  const app = document.getElementById('app');
  const profiles = listProfiles();

  app.innerHTML = `
    <h1 class="app-title">🌈 Bright Steps</h1>
    <p class="greeting">Who is learning today?</p>
    <div class="profile-grid">
      ${profiles.map(p => {
        const acc = overallAccuracy(p);
        return `
          <div class="profile-card" data-id="${p.id}">
            <div class="profile-avatar">${p.avatar}</div>
            <div class="profile-name">${esc(p.name || 'Unnamed')}</div>
            <div class="profile-sub">${acc == null ? 'new learner' : Math.round(acc * 100) + '% overall'}</div>
          </div>`;
      }).join('')}
      <div class="profile-card add" id="addCard">
        <div class="profile-avatar">➕</div>
        <div class="profile-name">Add child</div>
        <div class="profile-sub">create a profile</div>
      </div>
    </div>
    ${state.active ? '<p class="parent-link"><button class="btn secondary" id="backHome">← Back</button></p>' : ''}`;

  document.querySelectorAll('.profile-card[data-id]').forEach(card => {
    card.onclick = () => { switchProfile(card.dataset.id); renderHome(); };
  });
  document.getElementById('addCard').onclick = () => renderProfileForm();
