<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no: stops little fingers pinch-zooming the game (respected when launched from the home-screen icon) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bright Steps — Learn Your Way</title>
  <meta name="description" content="Adaptive early-years learning for ages 4-7 (UK EYFS/KS1)." />

  <!-- PWA: installable app + iPhone home-screen support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#5f27cd" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bright Steps" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- modern rounded typeface (graceful fallback to system rounded fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    // Register the offline service worker (only over http/https, not file://)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
